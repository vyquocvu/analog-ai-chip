[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "analog-ai-chip"
version = "0.1.0"
description = "Design and simulation verification framework for an analog AI accelerator running language models"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Vy Quoc Vu"}]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "safetensors>=0.4"]
sim = ["pyspice>=1.5"]
load = ["safetensors>=0.4"]

[tool.setuptools.packages.find]
include = ["analog_ai*", "analog_llm*", "analog_layout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
