<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Menlo,Consolas,monospace">
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Current-mode differential crossbar column (0007)</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#7f8c8d">G+ / G- conductance cells · two transimpedance stages · differential readout · Vout = Rf·Gscale·sum w_i·(x_i−VREF)</text>

  <!-- VREF rail -->
  <line x1="60" y1="120" x2="120" y2="120" stroke="#333" stroke-width="2"/>
  <text x="40" y="124" font-size="12" fill="#333">VREF</text>
  <line x1="60" y1="120" x2="60" y2="560" stroke="#1a5276" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- inputs x0, x1 with + and - branches -->
  <text x="80" y="200" font-size="13" fill="#333">x0</text>
  <line x1="120" y1="200" x2="200" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="260" x2="200" y2="260" stroke="#333" stroke-width="2"/>
  <!-- plus branch x0 -> np -->
  <rect x="200" y="182" width="60" height="36" fill="#eaf2f8" stroke="#1a5276"/>
  <text x="230" y="205" text-anchor="middle" font-size="11" fill="#1a5276">G+0</text>
  <line x1="260" y1="200" x2="330" y2="200" stroke="#333" stroke-width="2"/>
  <!-- minus branch x0 -> nm -->
  <rect x="200" y="242" width="60" height="36" fill="#fdecea" stroke="#922b21"/>
  <text x="230" y="265" text-anchor="middle" font-size="11" fill="#922b21">G-0</text>
  <line x1="260" y1="260" x2="330" y2="260" stroke="#333" stroke-width="2"/>

  <text x="80" y="330" font-size="13" fill="#333">x1</text>
  <line x1="120" y1="330" x2="200" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="390" x2="200" y2="390" stroke="#333" stroke-width="2"/>
  <rect x="200" y="312" width="60" height="36" fill="#eaf2f8" stroke="#1a5276"/>
  <text x="230" y="335" text-anchor="middle" font-size="11" fill="#1a5276">G+1</text>
  <line x1="260" y1="330" x2="330" y2="330" stroke="#333" stroke-width="2"/>
  <rect x="200" y="372" width="60" height="36" fill="#fdecea" stroke="#922b21"/>
  <text x="230" y="395" text-anchor="middle" font-size="11" fill="#922b21">G-1</text>
  <line x1="260" y1="390" x2="330" y2="390" stroke="#333" stroke-width="2"/>

  <!-- summing nodes np and nm -->
  <circle cx="330" cy="200" r="4" fill="#1a5276"/><text x="336" y="196" font-size="11" fill="#1a5276">np</text>
  <circle cx="330" cy="390" r="4" fill="#922b21"/><text x="336" y="386" font-size="11" fill="#922b21">nm</text>
  <line x1="120" y1="330" x2="330" y2="200" stroke="#333" stroke-width="1.5" opacity="0.4"/>
  <line x1="120" y1="390" x2="330" y2="260" stroke="#333" stroke-width="1.5" opacity="0.4"/>
  <!-- nm vertical to share node -->
  <line x1="330" y1="260" x2="330" y2="390" stroke="#333" stroke-width="1.5" opacity="0.4"/>

  <!-- TIA plus (A1) -->
  <line x1="330" y1="200" x2="330" y2="160" stroke="#333"/>
  <rect x="430" y="150" width="120" height="64" fill="#eaf2f8" stroke="#1a5276"/>
  <text x="490" y="180" text-anchor="middle" font-size="13" fill="#1a5276">A1 (TIA+)</text>
  <line x1="450" y1="162" x2="440" y2="162" stroke="#333"/>
  <text x="440" y="158" font-size="11" fill="#666">−</text>
  <text x="440" y="212" font-size="11" fill="#666">+</text>
  <line x1="450" y1="208" x2="440" y2="212" stroke="#333"/>
  <line x1="330" y1="160" x2="440" y2="162" stroke="#333" stroke-width="2"/>
  <!-- feedback Rf np->Vp -->
  <rect x="360" y="120" width="34" height="24" fill="#fff" stroke="#333"/>
  <text x="377" y="137" text-anchor="middle" font-size="10">Rf</text>
  <line x1="330" y1="160" x2="360" y2="132" stroke="#333"/>
  <line x1="394" y1="132" x2="490" y2="132" stroke="#333"/>
  <line x1="490" y1="150" x2="490" y2="132" stroke="#333"/>
  <!-- Vp out -->
  <line x1="550" y1="182" x2="650" y2="182" stroke="#333" stroke-width="2"/>
  <text x="655" y="186" font-size="13" fill="#1a5276">Vp</text>
  <line x1="490" y1="214" x2="490" y2="300" stroke="#333" stroke-width="1.5"/>
  <line x1="490" y1="300" x2="60" y2="300" stroke="#333" stroke-width="1.5" opacity="0.4"/>

  <!-- TIA minus (A2) -->
  <line x1="330" y1="390" x2="330" y2="350" stroke="#333"/>
  <rect x="430" y="340" width="120" height="64" fill="#fdecea" stroke="#922b21"/>
  <text x="490" y="370" text-anchor="middle" font-size="13" fill="#922b21">A2 (TIA−)</text>
  <line x1="450" y1="352" x2="440" y2="352" stroke="#333"/>
  <line x1="450" y1="398" x2="440" y2="402" stroke="#333"/>
  <line x1="330" y1="350" x2="440" y2="352" stroke="#333" stroke-width="2"/>
  <rect x="360" y="310" width="34" height="24" fill="#fff" stroke="#333"/>
  <text x="377" y="327" text-anchor="middle" font-size="10">Rf</text>
  <line x1="330" y1="350" x2="360" y2="322" stroke="#333"/>
  <line x1="394" y1="322" x2="490" y2="322" stroke="#333"/>
  <line x1="490" y1="340" x2="490" y2="322" stroke="#333"/>
  <line x1="550" y1="372" x2="650" y2="372" stroke="#333" stroke-width="2"/>
  <text x="655" y="376" font-size="13" fill="#922b21">Vm</text>
  <line x1="490" y1="404" x2="490" y2="430" stroke="#333"/>
  <line x1="490" y1="430" x2="60" y2="430" stroke="#333" stroke-width="1.5" opacity="0.4"/>

  <!-- subtractor A3 -->
  <rect x="700" y="220" width="120" height="80" fill="#f4f6f7" stroke="#333"/>
  <text x="760" y="252" text-anchor="middle" font-size="13" fill="#333">A3 (diff)</text>
  <text x="760" y="272" text-anchor="middle" font-size="11" fill="#333">Vout=Vm−Vp</text>
  <line x1="650" y1="182" x2="702" y2="240" stroke="#333" stroke-width="2"/>
  <line x1="650" y1="372" x2="702" y2="280" stroke="#333" stroke-width="2"/>
  <text x="670" y="205" font-size="11" fill="#666">Vp</text>
  <text x="670" y="352" font-size="11" fill="#666">Vm</text>
  <line x1="820" y1="260" x2="900" y2="260" stroke="#333" stroke-width="2"/>
  <text x="905" y="264" font-size="13" fill="#111">Vout</text>

  <text x="480" y="600" text-anchor="middle" font-size="12" fill="#7f8c8d">Vout = Vm − Vp = Rf·Σ (x_i−VREF)·(G+_i − G-_i) = Rf·Gscale·Σ w_i·(x_i−VREF)</text>
</svg>
