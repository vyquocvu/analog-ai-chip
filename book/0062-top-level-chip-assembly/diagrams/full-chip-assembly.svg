<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Top-Level Monolithic Full-Chip Assembly &amp; Gate R15 Signoff</title>
  <desc id="desc">Full die assembly, FCBGA-676 I/O pad ring, ESD protection clamps, clock H-tree, and Gate R15 verification.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
      .chip{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
      .io{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
      .gate{fill:#ecfdf5;stroke:#059669;stroke-width:2}
      .head{font:bold 15px sans-serif;fill:#0f172a}
      .txt{font:13px sans-serif;fill:#334155}
      .tag{font:bold 11px sans-serif;fill:#475569}
      .wire{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>

  <!-- Title Banner -->
  <rect class="box" x="30" y="20" rx="8" width="900" height="45"/>
  <text class="head" x="50" y="48">Top-Level Full-Chip Assembly &amp; Physical Signoff (Gate R15 / Chapter 0062)</text>

  <!-- Section 1: Monolithic Die Assembly -->
  <rect class="chip" x="30" y="85" rx="8" width="275" height="240"/>
  <text class="head" x="45" y="115">1. Monolithic Die Assembly</text>
  <text class="tag" x="45" y="135">18.33 mm × 18.33 mm (336.1 mm²)</text>
  <text class="txt" x="45" y="165">• Target: T0_GPT2_124M Accelerators</text>
  <text class="txt" x="45" y="190">• Compute Hierarchy: 4×4 TPU Clusters</text>
  <text class="txt" x="45" y="215">• 2D Mesh NoC Backbone (Metal 7)</text>
  <text class="txt" x="45" y="240">• Global Clock: Balanced H-Tree (M8)</text>
  <text class="txt" x="45" y="265">• Global Skew: 11.4 ps (&lt; 15.0 ps limit)</text>
  <text class="tag" x="45" y="295">STATUS: Monolithic Die Integrated</text>

  <!-- Section 2: FCBGA-676 & ESD Ring -->
  <rect class="io" x="340" y="85" rx="8" width="275" height="240"/>
  <text class="head" x="355" y="115">2. FCBGA-676 &amp; ESD Ring</text>
  <text class="tag" x="355" y="135">FLIP-CHIP BALL GRID ARRAY</text>
  <text class="txt" x="355" y="165">• Package: 26 × 26 (676 ball BGA)</text>
  <text class="txt" x="355" y="190">• Bump Pitch: 650 µm | Pad: 120 µm</text>
  <text class="txt" x="355" y="215">• ESD Rating (HBM): &gt; 2.0 kV Target</text>
  <text class="txt" x="355" y="240">• ESD Rating (CDM): &gt; 500 V Target</text>
  <text class="txt" x="355" y="265">• Clamps: Dual-Diode + ggNMOS</text>
  <text class="tag" x="355" y="295">STATUS: Package &amp; I/O Signoff</text>

  <!-- Section 3: Gate R15 Exit Report -->
  <rect class="gate" x="655" y="85" rx="8" width="275" height="240"/>
  <text class="head" x="670" y="115">3. Gate R15 Exit Signoff</text>
  <text class="tag" x="670" y="135">PHYSICAL LAYOUT &amp; DRC/LVS</text>
  <text class="txt" x="670" y="165">• WP15.1 ReRAM Macro Layout: PASSED</text>
  <text class="txt" x="670" y="190">• WP15.2 SAR ADC/DAC &amp; LVS: PASSED</text>
  <text class="txt" x="670" y="215">• WP15.3 Tile Power IR Drop: PASSED</text>
  <text class="txt" x="670" y="240">• WP15.4 Full-Chip Assembly: PASSED</text>
  <text class="txt" x="670" y="265">• Full-Chip DRC Violations: 0</text>
  <text class="tag" x="670" y="295">GATE R15 STATUS: PASSED (CLOSED)</text>

  <!-- Footnote -->
  <text class="tag" x="30" y="355">GATE R15 EXIT: Monolithic 336.1 mm² full-chip DRC/LVS signoff complete. Ready for Gate R16 extraction.</text>
</svg>
