<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img">
  <title>Multi-Corner STA Slack Distribution</title>
  <rect width="960" height="380" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="30" y="35" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">
    Multi-Corner PVT Setup &amp; Hold Slack Waterfall (WNS = 0.0 ps, TNS = 0.0 ps)
  </text>

  <!-- Horizontal zero line -->
  <line x1="80" y1="280" x2="880" y2="280" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="885" y="285" fill="#ef4444" font-family="monospace" font-size="12">0 ps Limit</text>
  
  <!-- Critical Paths Bars -->
  <!-- 1. NoC Router Arbiter -->
  <rect x="120" y="210" width="80" height="70" fill="#059669" rx="4"/>
  <text x="125" y="200" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">+216.8 ps</text>
  <text x="110" y="310" fill="#cbd5e1" font-family="sans-serif" font-size="11">NoC Arbiter</text>
  <text x="120" y="325" fill="#94a3b8" font-family="sans-serif" font-size="10">(SS Corner)</text>

  <!-- 2. NoC Crossbar Switch -->
  <rect x="270" y="180" width="80" height="100" fill="#059669" rx="4"/>
  <text x="275" y="170" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">+296.5 ps</text>
  <text x="260" y="310" fill="#cbd5e1" font-family="sans-serif" font-size="11">NoC Xbar</text>
  <text x="270" y="325" fill="#94a3b8" font-family="sans-serif" font-size="10">(SS Corner)</text>

  <!-- 3. SRAM Buffer -->
  <rect x="420" y="70" width="80" height="210" fill="#0284c7" rx="4"/>
  <text x="410" y="60" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">+15,640 ps</text>
  <text x="410" y="310" fill="#cbd5e1" font-family="sans-serif" font-size="11">SRAM Buffer</text>
  <text x="420" y="325" fill="#94a3b8" font-family="sans-serif" font-size="10">(Tile 50MHz)</text>

  <!-- 4. SAR ADC Logic -->
  <rect x="570" y="120" width="80" height="160" fill="#0284c7" rx="4"/>
  <text x="565" y="110" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">+2,715 ps</text>
  <text x="560" y="310" fill="#cbd5e1" font-family="sans-serif" font-size="11">SAR ADC Reg</text>
  <text x="570" y="325" fill="#94a3b8" font-family="sans-serif" font-size="10">(ADC 200MHz)</text>

  <!-- 5. CDC Synchronizer Hold -->
  <rect x="720" y="260" width="80" height="20" fill="#eab308" rx="4"/>
  <text x="730" y="250" fill="#facc15" font-family="monospace" font-size="12" font-weight="bold">+16.7 ps</text>
  <text x="710" y="310" fill="#cbd5e1" font-family="sans-serif" font-size="11">CDC Hold Slack</text>
  <text x="725" y="325" fill="#94a3b8" font-family="sans-serif" font-size="10">(FF Corner)</text>
  
  <!-- Status Tag -->
  <rect x="680" y="30" width="240" height="40" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <text x="700" y="55" fill="#ecfdf5" font-family="sans-serif" font-size="13" font-weight="bold">100% Timing Met (0 Errors)</text>
</svg>
