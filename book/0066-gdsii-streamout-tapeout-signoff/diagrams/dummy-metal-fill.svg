<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img">
  <title>CMP Dummy Metal Fill &amp; Planar Density Gradient</title>
  <rect width="960" height="380" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="30" y="35" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">
    Chemical-Mechanical Planarization (CMP) Dummy Metal Fill &amp; Density Distribution
  </text>
  
  <!-- Left Box: Pre-Fill (Sparse Layout) -->
  <rect x="50" y="70" width="380" height="260" fill="#1e293b" stroke="#64748b" stroke-width="1.5" rx="6"/>
  <text x="70" y="100" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Pre-Fill Layout (Active Routing Only)</text>
  <text x="70" y="125" fill="#94a3b8" font-family="sans-serif" font-size="12">Metal Density: 12.4% (&lt;20% Foundry Violation)</text>
  
  <!-- Active Wires (Blue bars) -->
  <rect x="100" y="150" width="280" height="15" fill="#0284c7"/>
  <rect x="100" y="210" width="280" height="15" fill="#0284c7"/>
  <rect x="100" y="270" width="280" height="15" fill="#0284c7"/>
  
  <!-- Right Box: Post-Fill (Dummy Tiles Added) -->
  <rect x="530" y="70" width="380" height="260" fill="#1e293b" stroke="#059669" stroke-width="2" rx="6"/>
  <text x="550" y="100" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold">Post-Fill Layout (Floating Dummy Tiles)</text>
  <text x="550" y="125" fill="#a7f3d0" font-family="sans-serif" font-size="12">Metal Density: 42.5% (20%–80% Compliant, Δρ = 4.2%)</text>
  
  <!-- Active Wires -->
  <rect x="580" y="150" width="280" height="15" fill="#0284c7"/>
  <rect x="580" y="210" width="280" height="15" fill="#0284c7"/>
  <rect x="580" y="270" width="280" height="15" fill="#0284c7"/>
  
  <!-- Staggered Dummy Metal Tiles (Orange) -->
  <!-- Row 1 -->
  <rect x="600" y="175" width="20" height="20" fill="#f97316" rx="2"/>
  <rect x="660" y="175" width="20" height="20" fill="#f97316" rx="2"/>
  <rect x="720" y="175" width="20" height="20" fill="#f97316" rx="2"/>
  <rect x="780" y="175" width="20" height="20" fill="#f97316" rx="2"/>
  <!-- Row 2 -->
  <rect x="630" y="235" width="20" height="20" fill="#f97316" rx="2"/>
  <rect x="690" y="235" width="20" height="20" fill="#f97316" rx="2"/>
  <rect x="750" y="235" width="20" height="20" fill="#f97316" rx="2"/>
  <rect x="810" y="235" width="20" height="20" fill="#f97316" rx="2"/>
  
  <!-- Arrow in Middle -->
  <path d="M 450 200 L 510 200" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="445" y="185" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">CMP FILL</text>
  
  <!-- Bottom note -->
  <text x="50" y="355" fill="#94a3b8" font-family="sans-serif" font-size="12">
    200 nm keepout clearance strictly enforced around active clock, power, and analog bitlines.
  </text>
</svg>
