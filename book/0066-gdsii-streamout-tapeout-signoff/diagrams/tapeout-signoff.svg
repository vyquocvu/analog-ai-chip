<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">28nm Foundry Tape-Out Signoff &amp; GDSII Stream-Out</title>
  <desc id="desc">10-point foundry tape-out checklist, CMP dummy metal fill planarity, and GDSII stream-out for Gate R17.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
      .gds{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
      .cmp{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
      .sign{fill:#ecfdf5;stroke:#059669;stroke-width:2}
      .head{font:bold 15px sans-serif;fill:#0f172a}
      .txt{font:13px sans-serif;fill:#334155}
      .tag{font:bold 11px sans-serif;fill:#475569}
      .wire{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>

  <!-- Title Banner -->
  <rect class="box" x="30" y="20" rx="8" width="900" height="45"/>
  <text class="head" x="50" y="48">28nm Foundry Tape-Out Signoff &amp; GDSII Stream-Out (Gate R17 / Chapter 0066)</text>

  <!-- Section 1: GDSII Streamout -->
  <rect class="gds" x="30" y="85" rx="8" width="275" height="240"/>
  <text class="head" x="45" y="115">1. GDSII / OASIS Stream-Out</text>
  <text class="tag" x="45" y="135">MASK DATA SYNTHESIS</text>
  <text class="txt" x="45" y="165">• Format: GDSII v6.0 / OASIS v1.0</text>
  <text class="txt" x="45" y="190">• Layers: M1–M8, Via4_RERAM, Pads</text>
  <text class="txt" x="45" y="215">• Scribe Line Seal Ring: 100 µm</text>
  <text class="txt" x="45" y="240">• Monolithic Die: 336.14 mm²</text>
  <text class="txt" x="45" y="265">• SHA-256 Checksum Validated</text>
  <text class="tag" x="45" y="295">STATUS: GDSII Stream-Out Clean</text>

  <!-- Section 2: CMP Dummy Fill -->
  <rect class="cmp" x="340" y="85" rx="8" width="275" height="240"/>
  <text class="head" x="355" y="115">2. CMP Planarity Dummy Fill</text>
  <text class="tag" x="355" y="135">SLIDING WINDOW DENSITY</text>
  <text class="txt" x="355" y="165">• Target Window: 50 µm × 50 µm</text>
  <text class="txt" x="355" y="190">• Lower Metal Dummy: 1.0 µm tiles</text>
  <text class="txt" x="355" y="215">• Top Metal Dummy: 2.0 µm tiles</text>
  <text class="txt" x="355" y="240">• Avg Metal Density: 42.5% (20–80%)</text>
  <text class="txt" x="355" y="265">• Max Spatial Gradient: 4.2% (≤15%)</text>
  <text class="tag" x="355" y="295">STATUS: DFM Planarity Met</text>

  <!-- Section 3: 10-Point Checklist -->
  <rect class="sign" x="655" y="85" rx="8" width="275" height="240"/>
  <text class="head" x="670" y="115">3. 10-Point Foundry Checklist</text>
  <text class="tag" x="670" y="135">TAPE-OUT READY VERIFICATION</text>
  <text class="txt" x="670" y="165">• DRC / LVS: 100% Clean (0 Errors)</text>
  <text class="txt" x="670" y="190">• PEX / STA: Setup/Hold Slack &gt; 0 ps</text>
  <text class="txt" x="670" y="215">• PDN / EM: MTTF 25.5 yr (J 0.42 mA/µm)</text>
  <text class="txt" x="670" y="240">• ESD / Package: &gt;2 kV HBM / FCBGA</text>
  <text class="txt" x="670" y="265">• Passed Criteria: 10 / 10 Points</text>
  <text class="tag" x="670" y="295">VERDICT: TAPE-OUT APPROVED</text>

  <!-- Footnote -->
  <text class="tag" x="30" y="355">CLAIM LEVEL: GDSII stream-out, CMP dummy metal fill synthesis, and 10-point foundry tape-out signoff.</text>
</svg>
