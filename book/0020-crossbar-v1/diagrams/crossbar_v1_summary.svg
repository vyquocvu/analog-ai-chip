<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .box-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 6; }
      .box-green { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 6; }
      .box-purple { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.5; rx: 6; }
      .box-orange { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; rx: 6; }
      .label-bold { font-size: 13px; font-weight: bold; fill: #0f172a; }
      .label-sub { font-size: 11px; fill: #64748b; }
      .label-blue { font-size: 12px; font-weight: bold; fill: #2563eb; }
      .label-green { font-size: 12px; font-weight: bold; fill: #047857; }
      .label-purple { font-size: 12px; font-weight: bold; fill: #9333ea; }
      .label-orange { font-size: 12px; font-weight: bold; fill: #ea580c; }
      .math-box { font-family: 'Menlo', 'Consolas', monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="#ffffff"/>

  <!-- Title Header -->
  <text x="480" y="32" text-anchor="middle" class="title">Crossbar-v1 Validated 2D Tile Physical Contract (0020)</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Gate R4 Exit: Complete physical evidence ledger for 2D in-memory computing tiles</text>

  <!-- Left Container: Tile Hardware Architecture -->
  <rect x="40" y="75" width="460" height="420" class="box"/>
  <text x="55" y="102" class="label-bold">Physical 2D Tile Contract (N ≤ 32)</text>

  <!-- DAC Input Stage -->
  <rect x="55" y="125" width="100" height="50" class="box-blue"/>
  <text x="105" y="146" text-anchor="middle" class="label-blue">DAC Array</text>
  <text x="105" y="162" text-anchor="middle" class="math-box">V_in ≤ 0.25V</text>

  <!-- Arrow to Crossbar -->
  <line x1="155" y1="150" x2="195" y2="150" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="195,147 203,150 195,153" fill="#3b82f6"/>

  <!-- 2D Crossbar Matrix Block -->
  <rect x="205" y="125" width="160" height="220" class="box-green"/>
  <text x="285" y="148" text-anchor="middle" class="label-green">2D Crossbar Mesh</text>
  <text x="285" y="168" text-anchor="middle" class="math-box">R_w = 1.0 Ω/seg</text>
  <text x="285" y="185" text-anchor="middle" class="math-box">C_seg = 1.5 fF</text>
  <text x="285" y="210" text-anchor="middle" class="math-box">G_min = 10 μS</text>
  <text x="285" y="228" text-anchor="middle" class="math-box">G_max = 100 μS</text>
  <text x="285" y="255" text-anchor="middle" class="math-box">σ_tot = 3.16%</text>
  <text x="285" y="273" text-anchor="middle" class="math-box">t_settle = 20.5 ps</text>
  <text x="285" y="298" text-anchor="middle" class="label-sub" fill="#047857">Max Tile: 32×32</text>

  <!-- Output Arrow to TIA / ADC -->
  <line x1="285" y1="345" x2="285" y2="385" stroke="#10b981" stroke-width="2"/>
  <polygon points="282,385 285,393 288,385" fill="#10b981"/>

  <!-- TIA & ADC Output Stage -->
  <rect x="205" y="395" width="160" height="85" class="box-purple"/>
  <text x="285" y="418" text-anchor="middle" class="label-purple">Column TIA + SAR ADC</text>
  <text x="285" y="438" text-anchor="middle" class="math-box">R_f = 10 kΩ | VREF = 2.5V</text>
  <text x="285" y="456" text-anchor="middle" class="math-box">Differential ±2.5V Range</text>

  <!-- Right Container: Physical Evidence Ledger -->
  <rect x="520" y="75" width="400" height="420" class="box"/>
  <text x="535" y="102" class="label-bold">Gate R4 Validated Evidence Ledger</text>

  <!-- Chapter 0015 Ledger -->
  <rect x="535" y="120" width="370" height="65" class="box-blue"/>
  <text x="545" y="138" class="label-blue">1. Compact Model (0015):</text>
  <text x="545" y="156" class="math-box">• G_min = 10 μS (100kΩ) | G_max = 100 μS (10kΩ)</text>
  <text x="545" y="172" class="math-box">• 10× on/off ratio | 4b/6b states | V_read ≤ 0.25V</text>

  <!-- Chapter 0016 Ledger -->
  <rect x="535" y="195" width="370" height="65" class="box-orange"/>
  <text x="545" y="213" class="label-orange">2. Noise &amp; Variation (0016):</text>
  <text x="545" y="231" class="math-box">• σ_prog = 3.0% (write) | σ_read = 1.0% (RTN)</text>
  <text x="545" y="247" class="math-box">• σ_w(0) = 0.50% noise floor | σ_w(1) = 3.53%</text>

  <!-- Chapter 0017 Ledger -->
  <rect x="535" y="270" width="370" height="65" class="box-green"/>
  <text x="545" y="288" class="label-green">3. Interconnect &amp; IR Drop (0017):</text>
  <text x="545" y="306" class="math-box">• R_wire = 1.0 Ω/seg | Error ∝ N²·R_w·G_max</text>
  <text x="545" y="322" class="math-box">• 16×16: 1.87% err | 32×32: 6.77% | 64×64: 21.8%</text>

  <!-- Chapter 0018 & 0019 Ledger -->
  <rect x="535" y="345" width="370" height="135" class="box-purple"/>
  <text x="545" y="363" class="label-purple">4. Dynamics, Drift &amp; Faults (0018 &amp; 0019):</text>
  <text x="545" y="381" class="math-box">• RC Settling: t_settle = 20.5 ps (f_max &gt; 40 GHz)</text>
  <text x="545" y="399" class="math-box">• Drift: G(t)=G₀(t/t₀)^(-ν), max -64.5% in 1 year</text>
  <text x="545" y="417" class="math-box">• Defects: p_fault=1.0% → 9.21% MVM column error</text>
  <text x="545" y="435" class="math-box">• I-V Non-Linearity: β = 1.0 V⁻² (+6.25% @ 0.25V)</text>
  <text x="545" y="465" class="label-bold" fill="#047857">Status: Gate R4 Exit Criteria Fully Closed ✓</text>

</svg>
