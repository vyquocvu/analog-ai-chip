<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .box-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 6; }
      .box-orange { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; rx: 6; }
      .box-purple { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.5; rx: 6; }
      .wire { stroke: #334155; stroke-width: 2; fill: none; }
      .label-bold { font-size: 13px; font-weight: bold; fill: #0f172a; }
      .label-sub { font-size: 11px; fill: #64748b; }
      .label-blue { font-size: 12px; font-weight: bold; fill: #2563eb; }
      .label-orange { font-size: 12px; font-weight: bold; fill: #ea580c; }
      .label-purple { font-size: 12px; font-weight: bold; fill: #9333ea; }
      .math-box { font-family: 'Menlo', 'Consolas', monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#ffffff"/>

  <!-- Title Header -->
  <text x="480" y="32" text-anchor="middle" class="title">NVM Programming Variation &amp; Read Noise Mechanisms (0016)</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Cycle-to-cycle write dispersion, temporal read noise, and differential error propagation</text>

  <!-- Left: Programming (Write) Noise Panel -->
  <rect x="40" y="75" width="280" height="380" class="box"/>
  <text x="55" y="102" class="label-bold">1. Programming (Write) Variation</text>
  <text x="55" y="118" class="label-sub">Cycle-to-Cycle / Device-to-Device</text>

  <!-- Gaussian Bell Curves on Discrete States -->
  <!-- Target line G_k -->
  <line x1="80" y1="230" x2="280" y2="230" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="180" y1="140" x2="180" y2="230" stroke="#3b82f6" stroke-dasharray="3"/>
  <text x="180" y="248" text-anchor="middle" class="math-box" font-weight="bold">Target State G_k</text>

  <!-- Gaussian Curve Path -->
  <path d="M 100 230 C 140 230, 160 145, 180 145 C 200 145, 220 230, 260 230" fill="#dbeafe" opacity="0.6" stroke="#2563eb" stroke-width="2"/>
  <circle cx="180" cy="145" r="4" fill="#1d4ed8"/>
  <text x="210" y="160" class="math-box" fill="#1d4ed8">σ_prog = 3%</text>

  <!-- Explanation Box -->
  <rect x="55" y="275" width="250" height="165" class="box-blue"/>
  <text x="65" y="295" class="label-blue">Physical Origin:</text>
  <text x="65" y="315" class="math-box">• Stochastic filament width</text>
  <text x="65" y="333" class="math-box">• Pulse-and-verify granularity</text>
  <text x="65" y="358" class="label-blue">Mathematical Model:</text>
  <text x="65" y="378" class="math-box">G_prog = G_k · (1 + δ_prog)</text>
  <text x="65" y="398" class="math-box">δ_prog ~ N(0, σ_prog²)</text>
  <text x="65" y="420" class="label-sub">Permanent until next rewrite</text>

  <!-- Middle: Read (Temporal) Noise Panel -->
  <rect x="340" y="75" width="280" height="380" class="box"/>
  <text x="355" y="102" class="label-bold">2. Read (Temporal) Noise</text>
  <text x="355" y="118" class="label-sub">Random Telegraph Noise (RTN) &amp; Thermal</text>

  <!-- Fluctuation Waveform -->
  <rect x="360" y="140" width="240" height="90" fill="#f8fafc" stroke="#cbd5e1" rx="4"/>
  <line x1="360" y1="185" x2="600" y2="185" stroke="#94a3b8" stroke-dasharray="3"/>
  <text x="370" y="160" class="math-box" fill="#64748b">G_prog baseline</text>
  <!-- Noisy read trace -->
  <path d="M 370 185 L 390 180 L 410 192 L 430 178 L 450 188 L 470 182 L 490 190 L 510 176 L 530 186 L 550 183 L 570 189 L 590 184" fill="none" stroke="#ea580c" stroke-width="2"/>
  <text x="500" y="218" text-anchor="middle" class="math-box" fill="#c2410c">σ_read = 1%</text>

  <!-- Explanation Box -->
  <rect x="355" y="275" width="250" height="165" class="box-orange"/>
  <text x="365" y="295" class="label-orange">Physical Origin:</text>
  <text x="365" y="315" class="math-box">• Trap capture/emission (RTN)</text>
  <text x="365" y="333" class="math-box">• Thermal Johnson-Nyquist noise</text>
  <text x="365" y="358" class="label-orange">Mathematical Model:</text>
  <text x="365" y="378" class="math-box">G_read = G_prog · (1 + δ_read)</text>
  <text x="365" y="398" class="math-box">δ_read ~ N(0, σ_read²)</text>
  <text x="365" y="420" class="label-sub">Uncorrelated across MVM reads</text>

  <!-- Right: Differential Pair Error Propagation -->
  <rect x="640" y="75" width="280" height="380" class="box"/>
  <text x="655" y="102" class="label-bold">3. Differential Weight Variance</text>
  <text x="655" y="118" class="label-sub">Quadrature Noise Addition on (G+, G−)</text>

  <!-- Total Std Dev Formula -->
  <rect x="655" y="140" width="250" height="110" class="box-purple"/>
  <text x="665" y="162" class="label-purple">Total Cell Std Dev:</text>
  <text x="665" y="182" class="math-box">σ_tot = √(σ_prog² + σ_read²)</text>
  <text x="665" y="198" class="math-box">      = √(0.03² + 0.01²) = 3.16%</text>
  <text x="665" y="222" class="label-purple">Weight Variance Formula:</text>
  <text x="665" y="240" class="math-box">σ_w² = [(G+·σ_tot)² + (G−·σ_tot)²] / Span²</text>

  <!-- State Error Summary -->
  <rect x="655" y="275" width="250" height="165" class="box"/>
  <text x="665" y="298" class="label-bold">Differential Boundaries:</text>
  <text x="665" y="325" class="math-box" font-weight="bold">• Zero Weight (w = 0):</text>
  <text x="680" y="343" class="math-box">Both cells at G_min = 10 uS</text>
  <text x="680" y="360" class="math-box" fill="#2563eb">σ_w(0) = √2 · G_min · σ_tot / Span</text>
  <text x="680" y="377" class="math-box" font-weight="bold" fill="#2563eb">       = 0.497%  (Noise Floor)</text>

  <text x="665" y="402" class="math-box" font-weight="bold">• Full-Scale Weight (|w| = 1):</text>
  <text x="680" y="420" class="math-box">One cell at G_max = 100 uS</text>
  <text x="680" y="437" class="math-box" font-weight="bold" fill="#ea580c">σ_w(1) = 3.531%</text>

</svg>
