<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Monte Carlo Programming &amp; Read Variability Sweeps (0016)</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#64748b">σ_prog = 3.0%, σ_read = 1.0%, σ_tot = 3.16%, N=1000 trials/state, Seed = 42</text>

  
    <text x="480" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Panel 1: Conductance Std Dev per State (1000-Trial Monte Carlo vs G_k · σ_tot)</text>
    <line x1="90" y1="80" x2="870" y2="80" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="90" y1="185.0" x2="870" y2="185.0" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="90" y1="290" x2="870" y2="290" stroke="#334155" stroke-width="1.5"/>
    <line x1="90" y1="80" x2="90" y2="290" stroke="#334155" stroke-width="1.5"/>
    <text x="75" y="185.0" text-anchor="middle" transform="rotate(-90 75 185.0)" font-size="11" fill="#64748b">Std Dev σ_G (uS)</text>
    
  
    <text x="480" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Panel 2: Differential Weight Standard Deviation σ_w(w) across Target Weights</text>
    <line x1="90" y1="360" x2="870" y2="360" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="90" y1="465.0" x2="870" y2="465.0" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="90" y1="570" x2="870" y2="570" stroke="#334155" stroke-width="1.5"/>
    <line x1="90" y1="360" x2="90" y2="570" stroke="#334155" stroke-width="1.5"/>
    <text x="75" y="465.0" text-anchor="middle" transform="rotate(-90 75 465.0)" font-size="11" fill="#64748b">Weight Std Dev σ_w (%)</text>
    

  <!-- Panel 1 Legend -->
  <rect x="760" y="90" width="12" height="12" fill="#3b82f6" opacity="0.8"/>
  <text x="780" y="100" font-size="11" fill="#0f172a">Empirical Monte Carlo</text>
  <line x1="760" y1="115" x2="775" y2="115" stroke="#ea580c" stroke-width="2" stroke-dasharray="3"/>
  <text x="780" y="118" font-size="11" fill="#64748b">Theoretical G_k·σ_tot</text>

  <!-- Panel 2 X-Axis Labels -->
  <text x="90" y="590" text-anchor="middle" font-size="11" fill="#475569">-1.0</text>
  <text x="285" y="590" text-anchor="middle" font-size="11" fill="#475569">-0.5</text>
  <text x="480" y="590" text-anchor="middle" font-size="11" fill="#475569">0.0 (w_target)</text>
  <text x="675" y="590" text-anchor="middle" font-size="11" fill="#475569">+0.5</text>
  <text x="870" y="590" text-anchor="middle" font-size="11" fill="#475569">+1.0</text>

  <!-- Panel 2 Legend -->
  <circle cx="765" cy="375" r="4" fill="#2563eb"/>
  <text x="780" y="378" font-size="11" fill="#0f172a">Empirical σ_w</text>
  <line x1="760" y1="395" x2="775" y2="395" stroke="#ea580c" stroke-width="2" stroke-dasharray="4"/>
  <text x="780" y="398" font-size="11" fill="#64748b">Theoretical σ_w(w)</text>

