<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img">
  <title>Power Distribution Network (PDN) Impedance Spectrum</title>
  <rect width="960" height="380" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="30" y="35" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">
    Power Distribution Network Impedance Spectrum Z(f) vs Target Impedance (45 mΩ)
  </text>
  
  <!-- Coordinate Axis -->
  <line x1="80" y1="310" x2="880" y2="310" stroke="#64748b" stroke-width="2"/>
  <line x1="80" y1="310" x2="80" y2="70" stroke="#64748b" stroke-width="2"/>
  
  <!-- Y-Axis Labels (Impedance in mΩ) -->
  <text x="25" y="75" fill="#94a3b8" font-family="monospace" font-size="12">100 mΩ</text>
  <text x="30" y="165" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">45 mΩ (Z_target)</text>
  <text x="25" y="240" fill="#94a3b8" font-family="monospace" font-size="12">20 mΩ</text>
  <text x="30" y="315" fill="#94a3b8" font-family="monospace" font-size="12">0 mΩ (DC)</text>
  
  <!-- Target Impedance Line -->
  <line x1="80" y1="165" x2="880" y2="165" stroke="#38bdf8" stroke-dasharray="6,6" stroke-width="2"/>
  
  <!-- X-Axis Labels (Frequency) -->
  <text x="80" y="335" fill="#94a3b8" font-family="monospace" font-size="12">DC</text>
  <text x="280" y="335" fill="#94a3b8" font-family="monospace" font-size="12">100 MHz</text>
  <text x="500" y="335" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="bold">1.0 GHz (NoC Clk)</text>
  <text x="740" y="335" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">3.66 GHz (f_res)</text>
  <text x="860" y="335" fill="#94a3b8" font-family="monospace" font-size="12">10 GHz</text>
  
  <!-- Impedance Curve Z(f) -->
  <!-- Low freq: DC resistance 12 mOhm (y=265), drops with decap, rises at resonance (3.66 GHz, y=155), then inductive -->
  <path d="M 80 265 C 200 275, 300 290, 420 280 S 650 220, 740 155 S 820 180, 880 120" fill="none" stroke="#f97316" stroke-width="3.5"/>
  
  <!-- Anti-Resonance Peak Annotation -->
  <circle cx="740" cy="155" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <rect x="650" y="80" width="220" height="50" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="660" y="100" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Anti-Resonance Peak (3.66 GHz)</text>
  <text x="660" y="120" fill="#fca5a5" font-family="sans-serif" font-size="11">Z_peak = 48.6 mΩ (Harmonic Safe)</text>
  
  <!-- NoC Operating Point Annotation -->
  <circle cx="500" cy="250" r="6" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
  <line x1="500" y1="250" x2="500" y2="310" stroke="#22c55e" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="440" y="240" fill="#86efac" font-family="sans-serif" font-size="11" font-weight="bold">Z(1.0 GHz) = 18.2 mΩ &lt; 45 mΩ</text>
</svg>
