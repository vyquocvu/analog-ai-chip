<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Manifest-Driven Generalized Decoder Engine</title>
  <desc id="desc">ModelManifest drives architecture selection while preserving strict hybrid compute separation between analog projection matrices and digital operations.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .cfg{fill:#f8fafc;stroke:#64748b;stroke-width:2}
      .dig{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
      .ana{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
      .head{font:bold 16px sans-serif;fill:#0f172a}
      .txt{font:14px sans-serif;fill:#334155}
      .tag{font:bold 13px sans-serif;fill:#475569}
      .wire{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  
  <!-- Manifest Control Bar -->
  <rect class="cfg" x="30" y="25" rx="10" width="900" height="60"/>
  <text class="head" x="50" y="55">ModelManifest Controls</text>
  <text class="txt" x="260" y="55">Norm: LN/RMS · Pos: Learned/RoPE · MLP: GELU/SwiGLU · Attn: MHA/GQA/MQA · Tying: Tied/Untied</text>
  
  <!-- Embedding Stage -->
  <rect class="ana" x="30" y="110" rx="8" width="130" height="70"/>
  <text class="head" x="42" y="140">Token Emb</text>
  <text class="txt" x="42" y="162">Lookup / [V,H]</text>
  <line class="wire" x1="160" y1="145" x2="200" y2="145"/>
  
  <!-- Attention Sub-block -->
  <rect class="dig" x="205" y="110" rx="8" width="150" height="70"/>
  <text class="head" x="218" y="140">Attn Norm</text>
  <text class="txt" x="218" y="162">LayerNorm / RMS</text>
  <line class="wire" x1="355" y1="145" x2="395" y2="145"/>
  
  <rect class="ana" x="400" y="110" rx="8" width="160" height="70"/>
  <text class="head" x="415" y="140">Q / K / V Proj</text>
  <text class="txt" x="415" y="162">MHA / GQA / MQA</text>
  <line class="wire" x1="560" y1="145" x2="600" y2="145"/>
  
  <rect class="dig" x="605" y="110" rx="8" width="155" height="70"/>
  <text class="head" x="618" y="140">RoPE + Attn</text>
  <text class="txt" x="618" y="162">Causal / KV-Cache</text>
  <line class="wire" x1="760" y1="145" x2="800" y2="145"/>
  
  <rect class="ana" x="805" y="110" rx="8" width="125" height="70"/>
  <text class="head" x="825" y="140">Out Proj</text>
  <text class="txt" x="825" y="162">Matrix W_O</text>
  
  <!-- Feedback to MLP Sub-block -->
  <line class="wire" x1="865" y1="180" x2="865" y2="225"/>
  <line class="wire" x1="865" y1="225" x2="80" y2="225"/>
  <line class="wire" x1="80" y1="225" x2="80" y2="255"/>
  
  <!-- MLP Sub-block -->
  <rect class="dig" x="30" y="260" rx="8" width="150" height="70"/>
  <text class="head" x="45" y="290">MLP Norm</text>
  <text class="txt" x="45" y="312">LayerNorm / RMS</text>
  <line class="wire" x1="180" y1="295" x2="220" y2="295"/>
  
  <rect class="ana" x="225" y="260" rx="8" width="180" height="70"/>
  <text class="head" x="240" y="290">Up / Gate Proj</text>
  <text class="txt" x="240" y="312">Linear / Gated SwiGLU</text>
  <line class="wire" x1="405" y1="295" x2="445" y2="295"/>
  
  <rect class="dig" x="450" y="260" rx="8" width="155" height="70"/>
  <text class="head" x="465" y="290">Activation</text>
  <text class="txt" x="465" y="312">GELU / SiLU Gating</text>
  <line class="wire" x1="605" y1="295" x2="645" y2="295"/>
  
  <rect class="ana" x="650" y="260" rx="8" width="135" height="70"/>
  <text class="head" x="668" y="290">Down Proj</text>
  <text class="txt" x="668" y="312">Matrix W_down</text>
  <line class="wire" x1="785" y1="295" x2="815" y2="295"/>
  
  <!-- Final Head -->
  <rect class="ana" x="820" y="260" rx="8" width="110" height="70"/>
  <text class="head" x="835" y="290">LM Head</text>
  <text class="txt" x="835" y="312">Tied / Untied</text>
  
  <!-- Legend -->
  <text class="tag" x="30" y="365">LEGEND: Orange = Analog Crossbar Matrix Eligible | Blue = Digital Reference (NumPy) | Gray = Manifest Schema</text>
</svg>
