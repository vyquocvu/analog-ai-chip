  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Conductance State Discretization &amp; Differential Weight Transfer (0015)</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#64748b">G_min = 10 uS (HRS), G_max = 100 uS (LRS), Span = 90 uS, Step = 6.0 uS/state</text>

  
    <text x="480" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Panel 1: Programmed 4-Bit Discrete Conductance Levels (16 States: 10 uS .. 100 uS)</text>
    <line x1="90" y1="80" x2="870" y2="80" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="90" y1="185.0" x2="870" y2="185.0" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="90" y1="290" x2="870" y2="290" stroke="#334155" stroke-width="1.5"/>
    <line x1="90" y1="80" x2="90" y2="290" stroke="#334155" stroke-width="1.5"/>
    <text x="75" y="185.0" text-anchor="middle" transform="rotate(-90 75 185.0)" font-size="11" fill="#64748b">Conductance (uS)</text>
    
  
    <text x="480" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Panel 2: Differential Signed Weight Transfer Curve (w_target vs w_effective)</text>
    <line x1="90" y1="360" x2="870" y2="360" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="90" y1="465.0" x2="870" y2="465.0" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="90" y1="570" x2="870" y2="570" stroke="#334155" stroke-width="1.5"/>
    <line x1="90" y1="360" x2="90" y2="570" stroke="#334155" stroke-width="1.5"/>
    <text x="75" y="465.0" text-anchor="middle" transform="rotate(-90 75 465.0)" font-size="11" fill="#64748b">Effective Weight w_eff</text>
    

  <!-- Axis labels for Panel 2 -->
  <text x="90" y="590" text-anchor="middle" font-size="11" fill="#475569">-1.0</text>
  <text x="285" y="590" text-anchor="middle" font-size="11" fill="#475569">-0.5</text>
  <text x="480" y="590" text-anchor="middle" font-size="11" fill="#475569">0.0 (w_target)</text>
  <text x="675" y="590" text-anchor="middle" font-size="11" fill="#475569">+0.5</text>
  <text x="870" y="590" text-anchor="middle" font-size="11" fill="#475569">+1.0</text>

  <!-- Legend -->
  <circle cx="780" cy="385" r="4" fill="#ea580c"/>
  <text x="790" y="388" font-size="11" fill="#0f172a">Quantized Weight (4-bit)</text>
