<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .box-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 6; }
      .box-orange { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; rx: 6; }
      .wire { stroke: #334155; stroke-width: 2; fill: none; }
      .wire-node { fill: #334155; }
      .label-bold { font-size: 13px; font-weight: bold; fill: #0f172a; }
      .label-sub { font-size: 11px; fill: #64748b; }
      .label-blue { font-size: 12px; font-weight: bold; fill: #2563eb; }
      .label-orange { font-size: 12px; font-weight: bold; fill: #ea580c; }
      .math-box { font-family: 'Menlo', 'Consolas', monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#ffffff"/>

  <!-- Title Header -->
  <text x="480" y="32" text-anchor="middle" class="title">Programmable Conductance Cell &amp; Compact Model (0015)</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Physical 1T1R non-volatile memory cell, read/write voltage regimes, and differential mapping</text>

  <!-- Left: 1T1R Physical Cell Structure -->
  <rect x="40" y="75" width="280" height="380" class="box"/>
  <text x="55" y="102" class="label-bold">1T1R Cell Architecture</text>
  <text x="55" y="118" class="label-sub">Access Transistor + NVM Element</text>

  <!-- Bitline BL -->
  <line x1="180" y1="135" x2="180" y2="175" class="wire"/>
  <text x="180" y="130" text-anchor="middle" class="math-box" font-weight="bold" fill="#2563eb">Bit Line (BL: V_read)</text>

  <!-- Memristive Element Box -->
  <rect x="150" y="175" width="60" height="35" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="4"/>
  <text x="180" y="197" text-anchor="middle" class="math-box" font-weight="bold">G_cell</text>
  <line x1="180" y1="210" x2="180" y2="250" class="wire"/>

  <!-- Access MOSFET -->
  <!-- Drain -->
  <line x1="180" y1="250" x2="180" y2="270" class="wire"/>
  <line x1="165" y1="270" x2="195" y2="270" stroke="#334155" stroke-width="2.5"/>
  <!-- Channel Bars -->
  <line x1="165" y1="280" x2="195" y2="280" stroke="#334155" stroke-width="2"/>
  <!-- Gate -->
  <line x1="140" y1="280" x2="160" y2="280" class="wire"/>
  <text x="135" y="284" text-anchor="end" class="math-box" font-weight="bold" fill="#0f172a">WL (Gate)</text>
  <!-- Source -->
  <line x1="180" y1="280" x2="180" y2="330" class="wire"/>
  <text x="180" y="348" text-anchor="middle" class="math-box" font-weight="bold" fill="#64748b">Source Line (SL: GND)</text>

  <!-- Parameter Summary -->
  <rect x="55" y="365" width="250" height="75" class="box-blue"/>
  <text x="65" y="385" class="label-blue">Physical Parameters:</text>
  <text x="65" y="405" class="math-box">G_min = 10.0 uS (HRS, 100k)</text>
  <text x="65" y="425" class="math-box">G_max = 100.0 uS (LRS, 10k)</text>

  <!-- Middle: Operating Regimes -->
  <rect x="340" y="75" width="290" height="380" class="box"/>
  <text x="355" y="102" class="label-bold">Voltage Regimes &amp; Linearity</text>
  <text x="355" y="118" class="label-sub">Inference (Read) vs Programming (Write)</text>

  <!-- Diagram of Voltage Axis -->
  <rect x="360" y="145" width="250" height="60" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" rx="4"/>
  <text x="370" y="168" class="label-bold" fill="#047857">1. Read Regime (Inference)</text>
  <text x="370" y="188" class="math-box" fill="#065f46">|V_read| ≤ 0.25 V  (Ohmic I = V·G)</text>
  <text x="370" y="200" class="label-sub" fill="#047857">Non-disturb: State remains stable</text>

  <rect x="360" y="225" width="250" height="60" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" rx="4"/>
  <text x="370" y="248" class="label-bold" fill="#be123c">2. Write Regime (Programming)</text>
  <text x="370" y="268" class="math-box" fill="#9f1239">|V_prog| ≥ 1.2 V  (SET / RESET)</text>
  <text x="370" y="280" class="label-sub" fill="#be123c">Pulse-and-verify alters conductance</text>

  <!-- Quantization Levels -->
  <rect x="360" y="305" width="250" height="135" class="box-orange"/>
  <text x="370" y="328" class="label-orange">State Quantization (2^B):</text>
  <text x="370" y="350" class="math-box">• 4-Bit: 16 discrete levels</text>
  <text x="385" y="368" class="math-box">Step ΔG = 90 uS / 15 = 6.00 uS</text>
  <text x="370" y="392" class="math-box">• 6-Bit: 64 discrete levels</text>
  <text x="385" y="410" class="math-box">Step ΔG = 90 uS / 63 = 1.429 uS</text>
  <text x="370" y="430" class="label-sub">Quantization floor bounds weight precision</text>

  <!-- Right: Differential Cell Pair (G+, G-) -->
  <rect x="650" y="75" width="270" height="380" class="box"/>
  <text x="665" y="102" class="label-bold">Differential Pair Encoding</text>
  <text x="665" y="118" class="label-sub">Realizing Signed Weights w ∈ [-1, 1]</text>

  <!-- Differential Pair Schematic -->
  <rect x="670" y="145" width="105" height="70" class="box-blue"/>
  <text x="722" y="170" text-anchor="middle" class="label-blue">G+ Cell</text>
  <text x="722" y="195" text-anchor="middle" class="math-box" font-weight="bold">BL_plus</text>

  <rect x="795" y="145" width="105" height="70" class="box-blue"/>
  <text x="847" y="170" text-anchor="middle" class="label-blue">G− Cell</text>
  <text x="847" y="195" text-anchor="middle" class="math-box" font-weight="bold">BL_minus</text>

  <!-- Subtraction Node -->
  <circle cx="785" cy="255" r="16" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="785" y="261" text-anchor="middle" font-size="18" font-weight="bold" fill="#334155">−</text>
  <line x1="722" y1="215" x2="722" y2="255" class="wire"/>
  <line x1="722" y1="255" x2="769" y2="255" class="wire"/>
  <line x1="847" y1="215" x2="847" y2="255" class="wire"/>
  <line x1="847" y1="255" x2="801" y2="255" class="wire"/>
  <line x1="785" y1="271" x2="785" y2="305" class="wire"/>

  <rect x="670" y="305" width="230" height="135" class="box"/>
  <text x="680" y="328" class="label-bold">Effective Weight:</text>
  <text x="680" y="350" class="math-box" font-weight="bold" fill="#2563eb">w_eff = (G+ − G−) / Span</text>
  <text x="680" y="375" class="math-box">• w &gt; 0 : (G_min + w·Span, G_min)</text>
  <text x="680" y="395" class="math-box">• w = 0 : (G_min, G_min) → 0</text>
  <text x="680" y="415" class="math-box">• w &lt; 0 : (G_min, G_min + |w|·Span)</text>
  <text x="680" y="432" class="label-sub">Balanced zero eliminates HRS offset</text>

</svg>
