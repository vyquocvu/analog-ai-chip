<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Distributed RC Crossbar Transient Dynamics (0018)</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#64748b">R_wire = 1.0 Ohm, C_seg = 1.5 fF, Step = 0.25 V at t = 0.1 ns</text>

  
    <text x="480" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Panel 1: Step Response Waveforms I_out(t) vs Time across Array Sizes</text>
    <line x1="90" y1="80" x2="870" y2="80" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="90" y1="185.0" x2="870" y2="185.0" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="90" y1="290" x2="870" y2="290" stroke="#334155" stroke-width="1.5"/>
    <line x1="90" y1="80" x2="90" y2="290" stroke="#334155" stroke-width="1.5"/>
    <text x="75" y="185.0" text-anchor="middle" transform="rotate(-90 75 185.0)" font-size="11" fill="#64748b">Output Current (uA)</text>
    
  
    <text x="480" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Panel 2: 1% Settling Time (ps, Bars) and Max Frequency (GHz, Line) vs N</text>
    <line x1="90" y1="360" x2="870" y2="360" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="90" y1="465.0" x2="870" y2="465.0" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="90" y1="570" x2="870" y2="570" stroke="#334155" stroke-width="1.5"/>
    <line x1="90" y1="360" x2="90" y2="570" stroke="#334155" stroke-width="1.5"/>
    <text x="75" y="465.0" text-anchor="middle" transform="rotate(-90 75 465.0)" font-size="11" fill="#64748b">Settling Time t_settle (ps)</text>
    

