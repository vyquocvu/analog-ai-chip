<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .box-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 6; }
      .box-green { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 6; }
      .box-purple { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.5; rx: 6; }
      .box-orange { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; rx: 6; }
      .label-bold { font-size: 13px; font-weight: bold; fill: #0f172a; }
      .label-sub { font-size: 11px; fill: #64748b; }
      .label-blue { font-size: 12px; font-weight: bold; fill: #2563eb; }
      .label-green { font-size: 12px; font-weight: bold; fill: #047857; }
      .label-purple { font-size: 12px; font-weight: bold; fill: #9333ea; }
      .label-orange { font-size: 12px; font-weight: bold; fill: #ea580c; }
      .math-box { font-family: 'Menlo', 'Consolas', monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="#ffffff"/>

  <!-- Title Header -->
  <text x="480" y="32" text-anchor="middle" class="title">Physical Tile End-to-End Signal Flow (0021)</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Multi-profile contract: dac-r2r-v1 (4b) → crossbar-v1 (1T1R differential) → adc-sar-v1 (4b)</text>

  <!-- Stage 1: Input Vector Normalization -->
  <rect x="30" y="80" width="130" height="390" class="box-blue"/>
  <text x="95" y="105" text-anchor="middle" class="label-blue">1. Input Scaling</text>
  <text x="95" y="125" text-anchor="middle" class="label-sub">Digital Vector x ∈ ℝᴹ</text>

  <rect x="45" y="150" width="100" height="70" class="box" fill="#ffffff"/>
  <text x="95" y="172" text-anchor="middle" class="math-box">x_norm =</text>
  <text x="95" y="190" text-anchor="middle" class="math-box">(x / ||x||_∞)</text>
  <text x="95" y="208" text-anchor="middle" class="math-box">· V_dac_max</text>

  <text x="95" y="270" text-anchor="middle" class="label-bold">Range:</text>
  <text x="95" y="290" text-anchor="middle" class="math-box">[0, 2.34 V]</text>
  <text x="95" y="380" text-anchor="middle" class="label-sub">Saves peak norm</text>
  <text x="95" y="398" text-anchor="middle" class="math-box">||x||_∞ for unscaling</text>

  <!-- Arrow Stage 1 -> 2 -->
  <line x1="160" y1="275" x2="185" y2="275" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="185,271 193,275 185,279" fill="#3b82f6"/>

  <!-- Stage 2: 4-bit R-2R DAC Bank -->
  <rect x="195" y="80" width="130" height="390" class="box-orange"/>
  <text x="260" y="105" text-anchor="middle" class="label-orange">2. 4-bit R-2R DAC</text>
  <text x="260" y="125" text-anchor="middle" class="label-sub">dac-r2r-v1.json</text>

  <rect x="210" y="150" width="100" height="180" class="box" fill="#ffffff"/>
  <text x="260" y="175" text-anchor="middle" class="label-bold">16 Wordlines</text>
  <line x1="225" y1="200" x2="295" y2="200" stroke="#f97316" stroke-width="2"/>
  <line x1="225" y1="230" x2="295" y2="230" stroke="#f97316" stroke-width="2"/>
  <line x1="225" y1="260" x2="295" y2="260" stroke="#f97316" stroke-width="2"/>
  <line x1="225" y1="290" x2="295" y2="290" stroke="#f97316" stroke-width="2"/>
  <text x="260" y="315" text-anchor="middle" class="math-box">V_LSB = 156 mV</text>

  <text x="260" y="365" text-anchor="middle" class="math-box">V_i = code · V_LSB</text>
  <text x="260" y="385" text-anchor="middle" class="label-sub">Monotonic R-2R</text>

  <!-- Arrow Stage 2 -> 3 -->
  <line x1="325" y1="275" x2="350" y2="275" stroke="#f97316" stroke-width="2"/>
  <polygon points="350,271 358,275 350,279" fill="#f97316"/>

  <!-- Stage 3: Differential 2D Crossbar Matrix -->
  <rect x="360" y="80" width="220" height="390" class="box-green"/>
  <text x="470" y="105" text-anchor="middle" class="label-green">3. 2D Differential Crossbar</text>
  <text x="470" y="125" text-anchor="middle" class="label-sub">crossbar-v1.json (1T1R Cells)</text>

  <rect x="375" y="145" width="190" height="190" class="box" fill="#ffffff"/>
  <text x="470" y="168" text-anchor="middle" class="label-bold">Differential Pairs (G⁺, G⁻)</text>

  <!-- Conductance Matrix Grid -->
  <g transform="translate(390, 180)">
    <!-- Row 1 -->
    <circle cx="20" cy="15" r="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="20" y="18" text-anchor="middle" font-size="8" fill="#047857">G⁺</text>
    <circle cx="45" cy="15" r="8" fill="#fff1f2" stroke="#f43f5e"/>
    <text x="45" y="18" text-anchor="middle" font-size="8" fill="#e11d48">G⁻</text>
    <circle cx="105" cy="15" r="8" fill="#ecfdf5" stroke="#10b981"/>
    <circle cx="130" cy="15" r="8" fill="#fff1f2" stroke="#f43f5e"/>
    <!-- Row 2 -->
    <circle cx="20" cy="55" r="8" fill="#ecfdf5" stroke="#10b981"/>
    <circle cx="45" cy="55" r="8" fill="#fff1f2" stroke="#f43f5e"/>
    <circle cx="105" cy="55" r="8" fill="#ecfdf5" stroke="#10b981"/>
    <circle cx="130" cy="55" r="8" fill="#fff1f2" stroke="#f43f5e"/>
    <!-- Summation Labels -->
    <text x="32" y="95" text-anchor="middle" class="math-box" font-size="9">Col 0</text>
    <text x="117" y="95" text-anchor="middle" class="math-box" font-size="9">Col M-1</text>
  </g>

  <text x="470" y="360" text-anchor="middle" class="math-box">I_j⁺ = Σ G_ij⁺ · V_i</text>
  <text x="470" y="380" text-anchor="middle" class="math-box">I_j⁻ = Σ G_ij⁻ · V_i</text>
  <text x="470" y="405" text-anchor="middle" class="label-sub">G ∈ [10 μS, 100 μS] (10× span)</text>
  <text x="470" y="423" text-anchor="middle" class="label-sub">Balanced zero: w=0 → (10μS, 10μS)</text>

  <!-- Arrow Stage 3 -> 4 -->
  <line x1="580" y1="275" x2="605" y2="275" stroke="#10b981" stroke-width="2"/>
  <polygon points="605,271 613,275 605,279" fill="#10b981"/>

  <!-- Stage 4: TIA + 4-bit SAR ADC Bank -->
  <rect x="615" y="80" width="160" height="390" class="box-purple"/>
  <text x="695" y="105" text-anchor="middle" class="label-purple">4. TIA &amp; 4-bit SAR ADC</text>
  <text x="695" y="125" text-anchor="middle" class="label-sub">adc-sar-v1.json</text>

  <rect x="630" y="150" width="130" height="80" class="box" fill="#ffffff"/>
  <text x="695" y="172" text-anchor="middle" class="label-bold">Differential TIA</text>
  <text x="695" y="192" text-anchor="middle" class="math-box">V_diff = Rf·(I⁺ - I⁻)</text>
  <text x="695" y="210" text-anchor="middle" class="math-box">Rf = 10 kΩ | ±2.5V</text>

  <rect x="630" y="245" width="130" height="90" class="box" fill="#ffffff"/>
  <text x="695" y="268" text-anchor="middle" class="label-bold">4-bit SAR ADC</text>
  <text x="695" y="288" text-anchor="middle" class="math-box">16 Quantized Levels</text>
  <text x="695" y="306" text-anchor="middle" class="math-box">LSB = 312.5 mV</text>
  <text x="695" y="324" text-anchor="middle" class="label-sub">Binary Search</text>

  <text x="695" y="375" text-anchor="middle" class="label-bold">Outputs:</text>
  <text x="695" y="395" text-anchor="middle" class="math-box">Digital Codes [0..15]</text>

  <!-- Arrow Stage 4 -> 5 -->
  <line x1="775" y1="275" x2="800" y2="275" stroke="#9333ea" stroke-width="2"/>
  <polygon points="800,271 808,275 800,279" fill="#9333ea"/>

  <!-- Stage 5: Digital Scale Recovery -->
  <rect x="810" y="80" width="120" height="390" class="box-blue"/>
  <text x="870" y="105" text-anchor="middle" class="label-blue">5. Recovery</text>
  <text x="870" y="125" text-anchor="middle" class="label-sub">Result Vector y</text>

  <rect x="820" y="150" width="100" height="110" class="box" fill="#ffffff"/>
  <text x="870" y="175" text-anchor="middle" class="math-box">y = y_code</text>
  <text x="870" y="195" text-anchor="middle" class="math-box">· ||W||_∞</text>
  <text x="870" y="215" text-anchor="middle" class="math-box">· ||x||_∞</text>
  <text x="870" y="235" text-anchor="middle" class="math-box">/ V_dac_max</text>

  <text x="870" y="310" text-anchor="middle" class="label-bold">Output:</text>
  <text x="870" y="330" text-anchor="middle" class="math-box">y ≈ W @ x</text>
  <text x="870" y="360" text-anchor="middle" class="label-bold" fill="#047857">Cosine Sim:</text>
  <text x="870" y="380" text-anchor="middle" class="math-box" font-weight="bold" fill="#047857">0.9882 ✓</text>

</svg>
