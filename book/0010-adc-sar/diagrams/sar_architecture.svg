<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Menlo,Consolas,monospace">
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
  <style>
    .wire{stroke:#333;stroke-width:2.5;fill:none;}
    .box{fill:#eaf2f8;stroke:#1a5276;stroke-width:2;}
    .box2{fill:#f4f6f7;stroke:#333;stroke-width:2;}
    .txt{fill:#111;font-size:15px;}
    .lab{fill:#1a5276;font-size:13px;font-weight:bold;}
    .cap{fill:#7f8c8d;font-size:12px;}
    .imp{fill:#ca6f1e;font-size:13px;font-weight:bold;}
  </style>
  <text x="480" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">SAR ADC (0010) — 4-bit successive approximation</text>
  <text x="480" y="48" text-anchor="middle" class="cap">input front maps the differential TIA envelope onto the R-2R reference · VCVS comparator</text>

  <!-- input front -->
  <rect class="box" x="70" y="170" width="200" height="76" rx="6"/>
  <text x="170" y="198" text-anchor="middle" class="lab">input front</text>
  <text x="170" y="218" text-anchor="middle" class="txt" font-size="13">Vin = VREF/2 + Vdiff/2</text>
  <text x="170" y="236" text-anchor="middle" class="cap">±2.5 V → [0, 2.5 V]</text>
  <line class="wire" x1="30" y1="208" x2="70" y2="208"/>
  <text x="22" y="212" text-anchor="end" class="imp">Vdiff</text>
  <text x="22" y="226" text-anchor="end" class="cap">(from TIA)</text>

  <!-- comparator (VCVS) -->
  <path d="M330,160 L330,256 L450,208 Z" fill="#fdf2e9" stroke="#ca6f1e" stroke-width="2"/>
  <text x="348" y="196" text-anchor="middle" class="txt" font-size="13">comp</text>
  <text x="348" y="246" class="cap" font-size="11">−</text>
  <text x="348" y="172" class="cap" font-size="11">+</text>
  <line class="wire" x1="270" y1="208" x2="330" y2="208"/>
  <text x="285" y="198" class="cap">Vin</text>

  <!-- SAR register -->
  <rect class="box" x="540" y="120" width="180" height="70" rx="6"/>
  <text x="630" y="148" text-anchor="middle" class="lab">SAR register</text>
  <text x="630" y="168" text-anchor="middle" class="cap">MSB-first search</text>
  <line class="wire" x1="450" y1="208" x2="540" y2="208"/>
  <line class="wire" x1="630" y1="208" x2="630" y2="190"/>
  <circle cx="630" cy="208" r="3" fill="#333"/>
  <text x="480" y="198" class="cap">decision bit</text>

  <!-- R-2R reference ladder -->
  <rect class="box2" x="540" y="260" width="180" height="70" rx="6"/>
  <text x="630" y="288" text-anchor="middle" class="txt" font-size="13" font-weight="bold">R-2R reference</text>
  <text x="630" y="306" text-anchor="middle" class="cap">ladder (0009) · VREF = 2.5 V</text>
  <text x="630" y="322" text-anchor="middle" class="cap">code → Vref(code)</text>
  <line class="wire" x1="630" y1="190" x2="630" y2="260"/>
  <line class="wire" x1="630" y1="260" x2="360" y2="260"/>
  <line class="wire" x1="360" y1="260" x2="360" y2="256"/>
  <text x="500" y="250" class="cap">trial code</text>
  <text x="368" y="286" class="cap" font-size="11">ref = Vref(code)</text>

  <!-- reconstruction -->
  <rect class="box2" x="800" y="170" width="130" height="76" rx="6"/>
  <text x="865" y="198" text-anchor="middle" class="txt" font-size="12" font-weight="bold">reconstruct</text>
  <text x="865" y="216" text-anchor="middle" class="cap">Vdiff_hat =</text>
  <text x="865" y="232" text-anchor="middle" class="cap">2·(V_hat − VREF/2)</text>
  <line class="wire" x1="720" y1="155" x2="865" y2="170"/>
  <text x="865" y="152" text-anchor="middle" class="imp">code</text>

  <!-- output -->
  <line class="wire" x1="930" y1="208" x2="950" y2="208"/>
  <text x="948" y="212" text-anchor="end" class="imp">Vdiff_hat</text>

  <!-- annotation boxes -->
  <text x="170" y="90" text-anchor="middle" class="cap">differential envelope from crossbar-column-v1 headroom (derived)</text>
  <text x="630" y="90" text-anchor="middle" class="cap">search logic is functional; each comparator decision is an ngspice solve</text>
  <text x="865" y="90" text-anchor="middle" class="cap">quantization bound LSB = 0.15625 V (differential domain)</text>
  <line class="wire" stroke="#bbb" x1="170" y1="100" x2="170" y2="170"/>
  <line class="wire" stroke="#bbb" x1="630" y1="100" x2="630" y2="120"/>
  <line class="wire" stroke="#bbb" x1="865" y1="100" x2="865" y2="170"/>
</svg>
