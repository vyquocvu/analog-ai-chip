<text x="470" y="150" font-size="15" fill="#111" >matrix = 4 × 5 = 20 weights</text>
<text x="470" y="172" font-size="15" fill="#111" >physical tile = 2 × 3</text>
<text x="470" y="194" font-size="15" fill="#1a5276" font-weight="bold">2 row-groups × 2 col-groups = 4 tiles</text>
<text x="470" y="222" font-size="13" fill="#7f8c8d">T00, T01 each compute a partial MVM</text>
<text x="470" y="242" font-size="13" fill="#7f8c8d">output[rows 0:2] = T00 + T01 (accumulate)</text>
<text x="470" y="262" font-size="13" fill="#7f8c8d">output[rows 2:4] = T10 + T11</text>
<text x="480" y="400" text-anchor="middle" font-size="13" fill="#7f8c8d">train.py: tiled_mvm(matrix, vector, 2, 3) must equal matrix @ vector</text>
