<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="960" height="680" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">NVM Drift, Stuck Faults &amp; Non-Linear Conduction (0019)</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#64748b">Power-law relaxation ν ∈ [0.02, 0.06], defect rates p_fault ∈ [0.1%, 10%], cubic distortion β = 1.0 V⁻²</text>

  
    <text x="200" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Panel 1: Conductance Drift G(t)</text>
    <rect x="80" y="110" width="240" height="480" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <line x1="80" y1="350.0" x2="320" y2="350.0" stroke="#e2e8f0" stroke-dasharray="4"/>
    <text x="200" y="624" text-anchor="middle" font-size="10" fill="#64748b">Retention Time (log scale)</text>
    <text x="68" y="350.0" text-anchor="middle" transform="rotate(-90 68 350.0)" font-size="10" fill="#64748b">Conductance (uS)</text>
    
  
    <text x="510" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Panel 2: Stuck Fault Error</text>
    <rect x="390" y="110" width="240" height="480" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <line x1="390" y1="350.0" x2="630" y2="350.0" stroke="#e2e8f0" stroke-dasharray="4"/>
    <text x="510" y="624" text-anchor="middle" font-size="10" fill="#64748b">Total Defect Density (%)</text>
    <text x="378" y="350.0" text-anchor="middle" transform="rotate(-90 378 350.0)" font-size="10" fill="#64748b">MVM Error (%)</text>
    
  
    <text x="820" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Panel 3: I-V Non-Linearity</text>
    <rect x="700" y="110" width="240" height="480" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <line x1="700" y1="350.0" x2="940" y2="350.0" stroke="#e2e8f0" stroke-dasharray="4"/>
    <text x="820" y="624" text-anchor="middle" font-size="10" fill="#64748b">Read Voltage (V)</text>
    <text x="688" y="350.0" text-anchor="middle" transform="rotate(-90 688 350.0)" font-size="10" fill="#64748b">Cell Current (uA)</text>
    

