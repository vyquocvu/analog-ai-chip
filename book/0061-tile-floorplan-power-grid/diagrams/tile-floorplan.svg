<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Core Tile Floorplan &amp; Power Grid IR Drop Signoff</title>
  <desc id="desc">Tile physical floorplan, 28nm BEOL multi-layer power mesh routing, and IR drop signoff for Gate R15.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
      .tile{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
      .grid{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
      .ir{fill:#ecfdf5;stroke:#059669;stroke-width:2}
      .head{font:bold 15px sans-serif;fill:#0f172a}
      .txt{font:13px sans-serif;fill:#334155}
      .tag{font:bold 11px sans-serif;fill:#475569}
      .wire{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>

  <!-- Title Banner -->
  <rect class="box" x="30" y="20" rx="8" width="900" height="45"/>
  <text class="head" x="50" y="48">Core Tile Physical Floorplan &amp; Power Grid IR Drop Signoff (Gate R15 / Chapter 0061)</text>

  <!-- Section 1: Tile Floorplan -->
  <rect class="tile" x="30" y="85" rx="8" width="275" height="240"/>
  <text class="head" x="45" y="115">1. Core Tile Floorplan</text>
  <text class="tag" x="45" y="135">57.3 µm × 57.3 µm (3,283 µm²)</text>
  <text class="txt" x="45" y="165">• 4× ReRAM Sub-Arrays (32×32 macro)</text>
  <text class="txt" x="45" y="190">• 16× Pitch-Matched SAR ADCs</text>
  <text class="txt" x="45" y="215">• 4 KB Local SRAM (25 × 25 µm)</text>
  <text class="txt" x="45" y="240">• Tile Sequencer &amp; Router Port</text>
  <text class="txt" x="45" y="265">• Area vs Model: 3,283 vs 3,281.5 µm²</text>
  <text class="tag" x="45" y="295">STATUS: 100% Geometry Matched</text>

  <!-- Section 2: Power Mesh Topology -->
  <rect class="grid" x="340" y="85" rx="8" width="275" height="240"/>
  <text class="head" x="355" y="115">2. Multi-Layer Power Mesh</text>
  <text class="tag" x="355" y="135">M1–M6 DUAL-DOMAIN GRID</text>
  <text class="txt" x="355" y="165">• VDD_ANA = 1.0V | VDD_DIG = 0.9V</text>
  <text class="txt" x="355" y="190">• M5 Straps: 400 nm width @ 8 µm pitch</text>
  <text class="txt" x="355" y="215">• M6 Straps: 600 nm width @ 8 µm pitch</text>
  <text class="txt" x="355" y="240">• Peak Current: 1.20 mA / tile</text>
  <text class="txt" x="355" y="265">• Mesh Resistance: 1.23 Ω effective</text>
  <text class="tag" x="355" y="295">STATUS: Low-Impedance Power Rail</text>

  <!-- Section 3: IR Drop & EM Signoff -->
  <rect class="ir" x="655" y="85" rx="8" width="275" height="240"/>
  <text class="head" x="670" y="115">3. IR Drop &amp; EM Signoff</text>
  <text class="tag" x="670" y="135">VOLTAGE INTEGRITY CHECK</text>
  <text class="txt" x="670" y="165">• Max IR Drop: 1.48 mV (Limit ≤ 30 mV)</text>
  <text class="txt" x="670" y="190">• Supply Degradation: 0.15% (Nom 1.0V)</text>
  <text class="txt" x="670" y="215">• Worst Node Voltage: 0.9985 V</text>
  <text class="txt" x="670" y="240">• Current Density: 0.29 mA/µm (&lt; 1.5)</text>
  <text class="txt" x="670" y="265">• DRC Signoff: CLEAN (0 violations)</text>
  <text class="tag" x="670" y="295">VERDICT: POWER INTEGRITY PASSED</text>

  <!-- Footnote -->
  <text class="tag" x="30" y="355">CLAIM LEVEL: Physical Core Tile Floorplan &amp; Multi-Layer Power Mesh IR Drop Signoff.</text>
</svg>
