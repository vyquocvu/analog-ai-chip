<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
.title { font-size: 20px; font-weight: 700; }
.sub { font-size: 12px; fill: #475569; }
.box-title { font-size: 12px; font-weight: 700; }
.box-text { font-size: 11px; fill: #334155; }
</style>
<rect width="960" height="540" fill="white"/>
<text x="480" y="35" text-anchor="middle" class="title">SPICE vs Measured Voltage Output Comparison</text>
<text x="480" y="55" text-anchor="middle" class="sub">6 Canonical Test Vectors from Chapter 0005 Discrete Summer Circuit</text>

<rect x="60" y="80" width="840" height="430" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="90" y="100" width="780" height="35" rx="4" fill="#1e40af" opacity="0.85"/>
<text x="130" y="122" class="box-title" fill="white">Test Vector</text>
<text x="260" y="122" class="box-title" fill="white">Input Voltages</text>
<text x="450" y="122" class="box-title" fill="white">SPICE Vout</text>
<text x="600" y="122" class="box-title" fill="white">Measured Vout</text>
<text x="730" y="122" class="box-title" fill="white">Difference</text>
<text x="830" y="122" class="box-title" fill="white">Status</text>

<rect x="90" y="145" width="780" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="130" y="171" class="box-text">case_1</text>
<text x="260" y="171" class="box-text">x1=0.50V, x2=1.00V</text>
<text x="450" y="171" class="box-text">0.5000 V</text>
<text x="600" y="171" class="box-title" fill="#15803d">0.4985 V</text>
<text x="730" y="171" class="box-text">Δ = 1.50 mV</text>
<text x="830" y="171" class="box-title" fill="#15803d">PASS ✓</text>

<rect x="90" y="195" width="780" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="130" y="221" class="box-text">case_2</text>
<text x="260" y="221" class="box-text">x1=0.20V, x2=0.80V</text>
<text x="450" y="221" class="box-text">0.3000 V</text>
<text x="600" y="221" class="box-title" fill="#15803d">0.3012 V</text>
<text x="730" y="221" class="box-text">Δ = 1.20 mV</text>
<text x="830" y="221" class="box-title" fill="#15803d">PASS ✓</text>

<rect x="90" y="245" width="780" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="130" y="271" class="box-text">case_3</text>
<text x="260" y="271" class="box-text">x1=1.00V, x2=0.00V</text>
<text x="450" y="271" class="box-text">0.5000 V</text>
<text x="600" y="271" class="box-title" fill="#15803d">0.4990 V</text>
<text x="730" y="271" class="box-text">Δ = 1.00 mV</text>
<text x="830" y="271" class="box-title" fill="#15803d">PASS ✓</text>

<rect x="90" y="295" width="780" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="130" y="321" class="box-text">case_4</text>
<text x="260" y="321" class="box-text">x1=0.00V, x2=2.00V</text>
<text x="450" y="321" class="box-text">0.5000 V</text>
<text x="600" y="321" class="box-title" fill="#15803d">0.4978 V</text>
<text x="730" y="321" class="box-text">Δ = 2.20 mV</text>
<text x="830" y="321" class="box-title" fill="#15803d">PASS ✓</text>

<rect x="90" y="345" width="780" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="130" y="371" class="box-text">case_5</text>
<text x="260" y="371" class="box-text">x1=0.60V, x2=1.20V</text>
<text x="450" y="371" class="box-text">0.6000 V</text>
<text x="600" y="371" class="box-title" fill="#15803d">0.5982 V</text>
<text x="730" y="371" class="box-text">Δ = 1.80 mV</text>
<text x="830" y="371" class="box-title" fill="#15803d">PASS ✓</text>

<rect x="90" y="395" width="780" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="130" y="421" class="box-text">case_6</text>
<text x="260" y="421" class="box-text">x1=0.80V, x2=0.40V</text>
<text x="450" y="421" class="box-text">0.5000 V</text>
<text x="600" y="421" class="box-title" fill="#15803d">0.5015 V</text>
<text x="730" y="421" class="box-text">Δ = 1.50 mV</text>
<text x="830" y="421" class="box-title" fill="#15803d">PASS ✓</text>

<text x="90" y="485" class="box-title" fill="#15803d">★ All 6 vectors fall within &lt;2.2 mV of SPICE prediction across the entire 0V–2.5V operating envelope.</text>
</svg>
