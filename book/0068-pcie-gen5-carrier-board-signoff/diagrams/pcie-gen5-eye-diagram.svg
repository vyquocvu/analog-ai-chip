<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img">
  <title>PCIe Gen5 32 GT/s Differential Channel Eye Diagram</title>
  <rect width="960" height="380" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="30" y="35" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">
    PCIe Gen5 32 GT/s Differential Rx Eye Diagram &amp; CEM Compliance Mask
  </text>
  
  <!-- Coordinate Axis -->
  <line x1="80" y1="190" x2="880" y2="190" stroke="#475569" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="480" y1="60" x2="480" y2="320" stroke="#475569" stroke-dasharray="4,4" stroke-width="1.5"/>
  
  <!-- Y-Axis Labels (Voltage) -->
  <text x="25" y="75" fill="#94a3b8" font-family="monospace" font-size="12">+400 mV</text>
  <text x="25" y="115" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">+122.5 mV</text>
  <text x="30" y="195" fill="#94a3b8" font-family="monospace" font-size="12">0.0 mV</text>
  <text x="25" y="275" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">-122.5 mV</text>
  <text x="25" y="315" fill="#94a3b8" font-family="monospace" font-size="12">-400 mV</text>
  
  <!-- X-Axis Labels (Time) -->
  <text x="180" y="345" fill="#94a3b8" font-family="monospace" font-size="12">-0.50 UI (-15.6 ps)</text>
  <text x="440" y="345" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="bold">0.0 UI (Center)</text>
  <text x="700" y="345" fill="#94a3b8" font-family="monospace" font-size="12">+0.50 UI (+15.6 ps)</text>

  <!-- PCIe Gen5 Diamond Compliance Mask in Center (Red Polygon) -->
  <!-- Mask: Eye Height = 30 mV (+-15 mV -> y=180, 200), Eye Width = 0.30 UI (+-0.15 UI -> x=420, 540) -->
  <polygon points="480,175 540,190 480,205 420,190" fill="#ef4444" fill-opacity="0.35" stroke="#ef4444" stroke-width="2"/>
  <text x="445" y="195" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="bold">CEM MASK</text>
  
  <!-- Eye Opening Curves (Cyan / Magenta glowing differential traces) -->
  <!-- Top Rail -->
  <path d="M 180 85 Q 300 85, 480 85 T 780 85" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.9"/>
  <!-- Bottom Rail -->
  <path d="M 180 295 Q 300 295, 480 295 T 780 295" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.9"/>
  
  <!-- Transition Curves Crossing at -0.5UI and +0.5UI -->
  <!-- Rising Crosses -->
  <path d="M 180 295 C 280 290, 380 100, 480 85 S 680 85, 780 295" fill="none" stroke="#a855f7" stroke-width="2.5" opacity="0.75"/>
  <path d="M 180 85 C 280 90, 380 280, 480 295 S 680 295, 780 85" fill="none" stroke="#a855f7" stroke-width="2.5" opacity="0.75"/>
  <path d="M 280 190 Q 380 85, 480 85 T 680 190" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <path d="M 280 190 Q 380 295, 480 295 T 680 190" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- Measured Eye Height and Width Annotations -->
  <!-- Eye Height Dimension Line -->
  <line x1="580" y1="85" x2="580" y2="295" stroke="#22c55e" stroke-width="2"/>
  <line x1="570" y1="85" x2="590" y2="85" stroke="#22c55e" stroke-width="2"/>
  <line x1="570" y1="295" x2="590" y2="295" stroke="#22c55e" stroke-width="2"/>
  <rect x="595" y="170" width="220" height="45" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="605" y="190" fill="#ecfdf5" font-family="sans-serif" font-size="11" font-weight="bold">Measured Eye Height: 245.0 mV</text>
  <text x="605" y="207" fill="#a7f3d0" font-family="sans-serif" font-size="10">Spec Limit: ≥ 30.0 mV (+215 mV margin)</text>

  <!-- Eye Width Dimension Line -->
  <line x1="360" y1="230" x2="600" y2="230" stroke="#f59e0b" stroke-width="2"/>
  <line x1="360" y1="220" x2="360" y2="240" stroke="#f59e0b" stroke-width="2"/>
  <line x1="600" y1="220" x2="600" y2="240" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="255" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold">Eye Width: 0.62 UI (19.38 ps)</text>
</svg>
