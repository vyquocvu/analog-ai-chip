<text x="70" y="375" class="box-title">Key Finding</text>
<text x="70" y="398" class="box-text">★ Programming (NVM write, t_prog = 500 ns ASSUMED) dominates at 99% of total execution — matching Ch.0038/0039.</text>
<text x="70" y="420" class="box-text">★ Compute kernel (DAC+xbar+TIA+ADC = 100.00 ns) matches Ch.0038 latency model within 1% — cross-chapter consistency proven.</text>
<text x="70" y="442" class="box-text">★ Partial-sum accumulator: B_acc = B_ADC + ⌈log₂(K_c)⌉ = 4 + 2 = 6 bits — overflow safe.</text>
<text x="70" y="464" class="box-text">★ Buffer pressure: 0.0% stall rate — double-buffer SRAM refill is the dominant latency risk, not compute.</text>
<text x="70" y="490" class="box-text" fill="#b45309">⚠ Gate R9 requires FPGA measurement to replace ASSUMED timing params (t_prog, t_add, t_sram_rd/wr, t_noc) with MEASURED evidence.</text>
