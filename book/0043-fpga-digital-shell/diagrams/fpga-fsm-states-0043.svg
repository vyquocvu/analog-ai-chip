<text x="366" y="205" class="box-text">48 (18.3%)</text>
<rect x="90" y="231" width="165" height="35" rx="5" fill="#dcfce7" stroke="#22c55e"/>
<text x="172" y="254" text-anchor="middle" class="box-title" fill="#15803d">COMPUTE</text>
<rect x="270" y="236" width="91" height="26" rx="4" fill="#22c55e" opacity="0.5"/>
<text x="366" y="253" class="box-text">48 (18.3%)</text>
<rect x="90" y="279" width="165" height="35" rx="5" fill="#faf5ff" stroke="#9333ea"/>
<text x="172" y="302" text-anchor="middle" class="box-title" fill="#7e22ce">ACCUMULATE</text>
<rect x="270" y="284" width="91" height="26" rx="4" fill="#9333ea" opacity="0.5"/>
<text x="366" y="301" class="box-text">48 (18.3%)</text>
<rect x="90" y="327" width="165" height="35" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
<text x="172" y="350" text-anchor="middle" class="box-title" fill="#b45309">WRITEBACK</text>
<rect x="270" y="332" width="22" height="26" rx="4" fill="#f59e0b" opacity="0.5"/>
