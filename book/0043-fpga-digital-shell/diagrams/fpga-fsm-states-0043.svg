<text x="800" y="120" class="box-title">Count (% of total transitions)</text>
<rect x="90" y="135" width="165" height="35" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
<text x="172" y="158" text-anchor="middle" class="box-title" fill="#1e40af">FETCH_ACT</text>
