<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .box-highlight { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 6; }
      .box-alert { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; rx: 6; }
      .wire { stroke: #334155; stroke-width: 2; fill: none; }
      .wire-node { fill: #334155; }
      .opamp { fill: #ffffff; stroke: #1e293b; stroke-width: 2; }
      .label { font-size: 12px; fill: #1e293b; }
      .label-bold { font-size: 12px; font-weight: bold; fill: #0f172a; }
      .label-blue { font-size: 12px; font-weight: bold; fill: #2563eb; }
      .label-orange { font-size: 12px; font-weight: bold; fill: #ea580c; }
      .math-box { font-family: 'Menlo', 'Consolas', monospace; font-size: 11px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#ffffff"/>

  <!-- Title Header -->
  <text x="480" y="32" text-anchor="middle" class="title">TIA Summing-Node Loading &amp; Noise Gain Scaling (0014)</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Physical effects of scaling crossbar row count N on TIA loop gain, bandwidth, and settling</text>

  <!-- Left: Crossbar Column Section -->
  <rect x="40" y="75" width="460" height="380" class="box"/>
  <text x="55" y="100" class="label-bold">Crossbar Column with N Rows</text>

  <!-- Inputs and Resistors -->
  <!-- Row 0 -->
  <text x="60" y="145" class="label">x₀ (V_REF + u₀)</text>
  <line x1="160" y1="140" x2="200" y2="140" class="wire"/>
  <rect x="200" y="128" width="60" height="24" fill="#ffffff" stroke="#334155" stroke-width="1.5" rx="3"/>
  <text x="230" y="144" text-anchor="middle" class="math-box">G₀</text>
  <line x1="260" y1="140" x2="350" y2="140" class="wire"/>

  <!-- Row 1 -->
  <text x="60" y="205" class="label">x₁ (V_REF + u₁)</text>
  <line x1="160" y1="200" x2="200" y2="200" class="wire"/>
  <rect x="200" y="188" width="60" height="24" fill="#ffffff" stroke="#334155" stroke-width="1.5" rx="3"/>
  <text x="230" y="204" text-anchor="middle" class="math-box">G₁</text>
  <line x1="260" y1="200" x2="350" y2="200" class="wire"/>

  <!-- Dots -->
  <text x="230" y="245" text-anchor="middle" font-size="18" fill="#64748b" font-weight="bold">⋮</text>
  <text x="350" y="245" text-anchor="middle" font-size="18" fill="#64748b" font-weight="bold">⋮</text>

  <!-- Row N-1 -->
  <text x="60" y="295" class="label">x_{N-1}</text>
  <line x1="160" y1="290" x2="200" y2="290" class="wire"/>
  <rect x="200" y="278" width="60" height="24" fill="#ffffff" stroke="#334155" stroke-width="1.5" rx="3"/>
  <text x="230" y="294" text-anchor="middle" class="math-box">G_{N-1}</text>
  <line x1="260" y1="290" x2="350" y2="290" class="wire"/>

  <!-- Vertical Summing Bitline -->
  <line x1="350" y1="140" x2="350" y2="350" class="wire"/>
  <circle cx="350" cy="140" r="4" class="wire-node"/>
  <circle cx="350" cy="200" r="4" class="wire-node"/>
  <circle cx="350" cy="290" r="4" class="wire-node"/>
  <circle cx="350" cy="220" r="5" fill="#2563eb"/>

  <!-- Parasitic Capacitance -->
  <line x1="350" y1="350" x2="350" y2="370" class="wire"/>
  <line x1="330" y1="370" x2="370" y2="370" stroke="#334155" stroke-width="2"/>
  <line x1="330" y1="376" x2="370" y2="376" stroke="#334155" stroke-width="2"/>
  <line x1="350" y1="376" x2="350" y2="395" class="wire"/>
  <line x1="340" y1="395" x2="360" y2="395" stroke="#334155" stroke-width="2"/>
  <text x="380" y="380" class="math-box" fill="#ea580c">C_in = N · C_cell</text>
  <text x="380" y="395" class="label" font-size="10" fill="#64748b">(parasitic column cap)</text>

  <!-- Equivalent Total Conductance Box -->
  <rect x="60" y="345" width="220" height="90" class="box-highlight"/>
  <text x="70" y="368" class="label-blue">Summing Node Conductance:</text>
  <text x="70" y="390" class="math-box" font-weight="bold">G_tot = Σ G_i ≈ N · G₀</text>
  <text x="70" y="412" class="math-box">R_in(N) = 1 / (N · G₀)</text>
  <text x="70" y="426" class="label" font-size="10" fill="#64748b">Drops proportionally with N</text>

  <!-- Connect to TIA Op-Amp -->
  <line x1="350" y1="220" x2="420" y2="220" class="wire"/>
  <line x1="420" y1="220" x2="420" y2="200" class="wire"/>
  <line x1="420" y1="200" x2="560" y2="200" class="wire"/>
  <text x="390" y="212" class="math-box" font-weight="bold" fill="#2563eb">Node 'n'</text>

  <!-- Op-Amp TIA -->
  <!-- Op-Amp Triangle -->
  <polygon points="560,170 560,270 650,220" class="opamp"/>
  <text x="568" y="204" font-size="18" fill="#334155" font-weight="bold">−</text>
  <text x="568" y="244" font-size="18" fill="#334155" font-weight="bold">+</text>
  <text x="590" y="224" text-anchor="middle" class="math-box" font-size="10">A_OL</text>

  <!-- Non-inverting Reference -->
  <line x1="520" y1="240" x2="560" y2="240" class="wire"/>
  <circle cx="520" cy="240" r="3" class="wire-node"/>
  <text x="460" y="244" class="label">V_REF (2.5 V)</text>

  <!-- Feedback Resistor Rf -->
  <circle cx="480" cy="200" r="4" class="wire-node"/>
  <line x1="480" y1="200" x2="480" y2="130" class="wire"/>
  <line x1="480" y1="130" x2="540" y2="130" class="wire"/>
  <rect x="540" y="118" width="60" height="24" fill="#ffffff" stroke="#334155" stroke-width="1.5" rx="3"/>
  <text x="570" y="134" text-anchor="middle" class="math-box">R_F (10k)</text>
  <line x1="600" y1="130" x2="680" y2="130" class="wire"/>
  <line x1="680" y1="130" x2="680" y2="220" class="wire"/>
  <circle cx="680" cy="220" r="4" class="wire-node"/>

  <!-- TIA Output -->
  <line x1="650" y1="220" x2="720" y2="220" class="wire" marker-end="url(#arrow)"/>
  <text x="730" y="225" class="label-bold">V_out</text>

  <!-- Right: Theory & Scaling Equations Panel -->
  <rect x="520" y="270" width="400" height="185" class="box-alert"/>
  <text x="535" y="295" class="label-orange">Scaling Formulas &amp; Physical Limits:</text>

  <text x="535" y="320" class="math-box" font-weight="bold">1. Closed-Loop Noise Gain (NG):</text>
  <text x="555" y="338" class="math-box" fill="#0f172a">NG = 1 + R_F · G_tot ≈ 1 + N · R_F · G₀</text>

  <text x="535" y="365" class="math-box" font-weight="bold">2. Loop Gain Attenuation (T):</text>
  <text x="555" y="383" class="math-box" fill="#0f172a">T(s) = A_OL(s) / NG = A_OL / (1 + N · R_F · G₀)</text>

  <text x="535" y="410" class="math-box" font-weight="bold">3. DC Gain Error &amp; Bandwidth:</text>
  <text x="555" y="428" class="math-box" fill="#0f172a">Error_DC ≈ NG / A_OL  |  BW ≈ GBW / NG</text>
  <text x="555" y="444" class="math-box" fill="#ea580c">Settling time t_settle scales linearly with N</text>

</svg>
