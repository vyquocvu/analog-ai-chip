    <text x="75" y="185.0" text-anchor="middle" transform="rotate(-90 75 185.0)" font-size="11" fill="#64748b">MVM Error (%)</text>
    
  
    <text x="480" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Panel 2: Far-Corner Cell Voltage Deficit (%) vs Array Size N</text>
