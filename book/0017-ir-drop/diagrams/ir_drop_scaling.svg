    <line x1="90" y1="360" x2="90" y2="570" stroke="#334155" stroke-width="1.5"/>
    <text x="75" y="465.0" text-anchor="middle" transform="rotate(-90 75 465.0)" font-size="11" fill="#64748b">Voltage Deficit (%)</text>
    

