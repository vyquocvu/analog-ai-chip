  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#64748b">Worst-case all-LRS conductance (G_max = 100 uS), V_read = 0.25 V, array size N = 2 .. 64</text>

  
    <text x="480" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Panel 1: Relative MVM Output Error (%) vs Array Size N</text>
