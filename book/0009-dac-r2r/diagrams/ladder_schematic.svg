<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Menlo,Consolas,monospace">
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <style>
    .wire{stroke:#333;stroke-width:2.5;fill:none;}
    .res{fill:#fdebd0;stroke:#1a5276;stroke-width:2;}
    .sw{fill:#fdf2e9;stroke:#ca6f1e;stroke-width:2;}
    .txt{fill:#111;font-size:15px;}
    .lab{fill:#ca6f1e;font-size:13px;font-weight:bold;}
    .cap{fill:#7f8c8d;font-size:12px;}
    .node{fill:#fff;stroke:#1a5276;stroke-width:2;}
  </style>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">R-2R ladder DAC (0009)</text>
  <text x="480" y="50" text-anchor="middle" class="cap">4-bit · R = 10 kΩ · 2R = 20 kΩ · VREF = 2.5 V · Vout = VREF·code/16</text>

  <!-- series chain nodes -->
  <g stroke="#333" stroke-width="2.5" fill="none">
    <line x1="140" y1="180" x2="820" y2="180"/>
  </g>

  <!-- series R boxes s0..s3 -->
  <g class="res" transform="translate(195,168)"><rect width="50" height="24"/></g>
  <text x="220" y="158" text-anchor="middle" class="lab" font-size="12">R</text>
  <g class="res" transform="translate(355,168)"><rect width="50" height="24"/></g>
  <text x="380" y="158" text-anchor="middle" class="lab" font-size="12">R</text>
  <g class="res" transform="translate(515,168)"><rect width="50" height="24"/></g>
  <text x="540" y="158" text-anchor="middle" class="lab" font-size="12">R</text>
  <g class="res" transform="translate(695,168)"><rect width="50" height="24"/></g>
  <text x="720" y="158" text-anchor="middle" class="lab" font-size="12">R</text>

  <!-- nodes -->
  <circle class="node" cx="140" cy="180" r="5"/>
  <circle class="node" cx="300" cy="180" r="5"/>
  <circle class="node" cx="460" cy="180" r="5"/>
  <circle class="node" cx="620" cy="180" r="5"/>
  <circle class="node" cx="820" cy="180" r="5"/>

  <!-- bit legs: vertical 2R + switch -->
  <!-- n0 leg -->
  <line class="wire" x1="140" y1="185" x2="140" y2="240"/>
  <g class="res"><rect x="123" y="240" width="34" height="22"/></g>
  <text x="140" y="252" text-anchor="middle" class="lab" font-size="11">2R</text>
  <line class="wire" x1="140" y1="262" x2="140" y2="330"/>
  <rect class="sw" x="108" y="330" width="64" height="30"/>
  <text x="140" y="349" text-anchor="middle" class="lab" font-size="11">sw0</text>

  <!-- n1 leg -->
  <line class="wire" x1="300" y1="185" x2="300" y2="240"/>
  <g class="res"><rect x="283" y="240" width="34" height="22"/></g>
  <text x="300" y="252" text-anchor="middle" class="lab" font-size="11">2R</text>
  <line class="wire" x1="300" y1="262" x2="300" y2="330"/>
  <rect class="sw" x="268" y="330" width="64" height="30"/>
  <text x="300" y="349" text-anchor="middle" class="lab" font-size="11">sw1</text>

  <!-- n2 leg -->
  <line class="wire" x1="460" y1="185" x2="460" y2="240"/>
  <g class="res"><rect x="443" y="240" width="34" height="22"/></g>
  <text x="460" y="252" text-anchor="middle" class="lab" font-size="11">2R</text>
  <line class="wire" x1="460" y1="262" x2="460" y2="330"/>
  <rect class="sw" x="428" y="330" width="64" height="30"/>
  <text x="460" y="349" text-anchor="middle" class="lab" font-size="11">sw2</text>

  <!-- n3 leg -->
  <line class="wire" x1="620" y1="185" x2="620" y2="240"/>
  <g class="res"><rect x="603" y="240" width="34" height="22"/></g>
  <text x="620" y="252" text-anchor="middle" class="lab" font-size="11">2R</text>
  <line class="wire" x1="620" y1="262" x2="620" y2="330"/>
  <rect class="sw" x="588" y="330" width="64" height="30"/>
  <text x="620" y="349" text-anchor="middle" class="lab" font-size="11">sw3</text>

  <!-- termination 2R at n0 to gnd (left side) -->
  <line class="wire" x1="80" y1="180" x2="135" y2="180"/>
  <g class="res"><rect x="55" y="168" width="44" height="24"/></g>
  <text x="77" y="158" text-anchor="middle" class="lab" font-size="12">2R</text>
  <line class="wire" x1="77" y1="192" x2="77" y2="420"/>
  <g class="wire" fill="#fff">
    <line x1="67" y1="420" x2="87" y2="420"/>
    <line x1="72" y1="432" x2="82" y2="432"/>
    <line x1="76" y1="444" x2="78" y2="444"/>
  </g>
  <text x="110" y="436" class="cap">GND</text>

  <!-- node labels -->
  <text x="140" y="170" text-anchor="middle" class="cap">n0</text>
  <text x="300" y="170" text-anchor="middle" class="cap">n1</text>
  <text x="460" y="170" text-anchor="middle" class="cap">n2</text>
  <text x="620" y="170" text-anchor="middle" class="cap">n3</text>
  <text x="820" y="170" text-anchor="middle" class="lab">out</text>

  <!-- bit weights -->
  <text x="140" y="378" text-anchor="middle" class="cap">bit0 · 1/16</text>
  <text x="300" y="378" text-anchor="middle" class="cap">bit1 · 2/16</text>
  <text x="460" y="378" text-anchor="middle" class="cap">bit2 · 4/16</text>
  <text x="620" y="378" text-anchor="middle" class="cap">bit3 · 8/16</text>

  <!-- switch note -->
  <text x="480" y="410" text-anchor="middle" class="cap">switch bit = 1 → leg to VREF;  bit = 0 → leg to GND (ideal DC model)</text>

  <!-- output -->
  <line class="wire" x1="825" y1="180" x2="900" y2="180"/>
  <text x="900" y="172" text-anchor="end" class="txt" font-weight="bold">Vout</text>

  <text x="480" y="455" text-anchor="middle" font-size="13" class="txt">Vout = Σ bit_i · VREF · 2^i / 16      code = Σ bit_i · 2^i</text>
</svg>
