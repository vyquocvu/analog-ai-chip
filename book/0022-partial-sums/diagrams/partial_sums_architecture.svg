<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .box-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 6; }
      .box-green { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 6; }
      .box-purple { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.5; rx: 6; }
      .box-orange { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; rx: 6; }
      .box-red { fill: #fff1f2; stroke: #f43f5e; stroke-width: 1.5; rx: 6; }
      .label-bold { font-size: 13px; font-weight: bold; fill: #0f172a; }
      .label-sub { font-size: 11px; fill: #64748b; }
      .label-blue { font-size: 12px; font-weight: bold; fill: #2563eb; }
      .label-green { font-size: 12px; font-weight: bold; fill: #047857; }
      .label-purple { font-size: 12px; font-weight: bold; fill: #9333ea; }
      .label-orange { font-size: 12px; font-weight: bold; fill: #ea580c; }
      .math-box { font-family: 'Menlo', 'Consolas', monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="#ffffff"/>

  <!-- Title Header -->
  <text x="480" y="32" text-anchor="middle" class="title">Spatial Matrix Tiling &amp; Digital Partial Sums (0022)</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Partitioning large matrices into modular physical tiles (≤ 32×32) to eliminate IR drop</text>

  <!-- Left Container: Matrix Decomposition -->
  <rect x="35" y="75" width="270" height="425" class="box"/>
  <text x="50" y="102" class="label-bold">1. Matrix Spatial Decomposition</text>
  <text x="50" y="118" class="label-sub">W ∈ ℝᴹˣᴹ split into K_r × K_c tiles</text>

  <!-- 4-Block Tiling Matrix Grid -->
  <g transform="translate(60, 135)">
    <!-- Block W_00 -->
    <rect x="0" y="0" width="100" height="80" class="box-blue"/>
    <text x="50" y="35" text-anchor="middle" class="label-blue">Tile W₀,₀</text>
    <text x="50" y="52" text-anchor="middle" class="math-box">16 × 16</text>
    <!-- Block W_01 -->
    <rect x="115" y="0" width="100" height="80" class="box-orange"/>
    <text x="165" y="35" text-anchor="middle" class="label-orange">Tile W₀,₁</text>
    <text x="165" y="52" text-anchor="middle" class="math-box">16 × 16</text>
    <!-- Block W_10 -->
    <rect x="0" y="95" width="100" height="80" class="box-green"/>
    <text x="50" y="130" text-anchor="middle" class="label-green">Tile W₁,₀</text>
    <text x="50" y="147" text-anchor="middle" class="math-box">16 × 16</text>
    <!-- Block W_11 -->
    <rect x="115" y="95" width="100" height="80" class="box-purple"/>
    <text x="165" y="130" text-anchor="middle" class="label-purple">Tile W₁,₁</text>
    <text x="165" y="147" text-anchor="middle" class="math-box">16 × 16</text>
  </g>

  <!-- Vector input slices -->
  <rect x="60" y="330" width="100" height="35" class="box-blue"/>
  <text x="110" y="352" text-anchor="middle" class="math-box">x₀ (chunk 0)</text>
  <rect x="175" y="330" width="100" height="35" class="box-orange"/>
  <text x="225" y="352" text-anchor="middle" class="math-box">x₁ (chunk 1)</text>

  <text x="170" y="390" text-anchor="middle" class="label-bold">Input Slicing:</text>
  <text x="170" y="410" text-anchor="middle" class="math-box">x = [x₀, x₁, ..., x_Kc-1]ᵀ</text>
  <text x="170" y="430" text-anchor="middle" class="label-sub">Scaled locally per block norm</text>
  <text x="170" y="450" text-anchor="middle" class="math-box">A_ij = ||W_ij||_∞, X_j = ||x_j||_∞</text>

  <!-- Middle Container: Physical Tile Execution -->
  <rect x="325" y="75" width="280" height="425" class="box"/>
  <text x="340" y="102" class="label-bold">2. Parallel Tile Compute</text>
  <text x="340" y="118" class="label-sub">Analog CrossbarTile Forward Passes</text>

  <!-- Row 0 Tile Compute -->
  <rect x="340" y="140" width="250" height="75" class="box-blue"/>
  <text x="355" y="162" class="label-blue">Row 0 Partial Products:</text>
  <text x="355" y="182" class="math-box">y₀,₀ = TileForward(W₀,₀, x₀)</text>
  <text x="355" y="200" class="math-box">y₀,₁ = TileForward(W₀,₁, x₁)</text>

  <!-- Row 1 Tile Compute -->
  <rect x="340" y="235" width="250" height="75" class="box-green"/>
  <text x="355" y="257" class="label-green">Row 1 Partial Products:</text>
  <text x="355" y="277" class="math-box">y₁,₀ = TileForward(W₁,₀, x₀)</text>
  <text x="355" y="295" class="math-box">y₁,₁ = TileForward(W₁,₁, x₁)</text>

  <!-- Tile Properties -->
  <rect x="340" y="330" width="250" height="155" class="box-orange"/>
  <text x="350" y="350" class="label-orange">Tile Constraints &amp; Limits:</text>
  <text x="350" y="370" class="math-box">• Tile size: 16×16 or 32×32</text>
  <text x="350" y="388" class="math-box">• IR Drop kept &lt; 6.77%</text>
  <text x="350" y="406" class="math-box">• 4-bit DAC (156mV) &amp; SAR ADC</text>
  <text x="350" y="424" class="math-box">• Full 4-bit/6-bit G cell span</text>
  <text x="350" y="450" class="label-bold" fill="#ea580c">No single tile IR breakdown ✓</text>

  <!-- Right Container: Digital Adder Tree & Precision -->
  <rect x="625" y="75" width="300" height="425" class="box"/>
  <text x="640" y="102" class="label-bold">3. Digital Partial Sum Adder</text>
  <text x="640" y="118" class="label-sub">Accumulation &amp; Word-length Bounds</text>

  <!-- Adder Diagram -->
  <rect x="640" y="140" width="270" height="110" class="box-purple"/>
  <text x="650" y="162" class="label-purple">Digital Accumulator:</text>
  <text x="650" y="185" class="math-box">y₀ = y₀,₀ + y₀,₁ + ... + y₀,Kc-1</text>
  <text x="650" y="208" class="math-box">y₁ = y₁,₀ + y₁,₁ + ... + y₁,Kc-1</text>
  <text x="650" y="235" class="label-bold" fill="#9333ea">y = Σ_j y_ij (Exact FP32/INT)</text>

  <!-- Noise & Precision Rules -->
  <rect x="640" y="265" width="270" height="220" class="box-blue"/>
  <text x="650" y="285" class="label-blue">Scaling &amp; Precision Rules:</text>
  <text x="650" y="308" class="math-box">1. Noise Variance Scaling:</text>
  <text x="665" y="326" class="math-box">σ_accum = √(K_c) · σ_ADC</text>
  <text x="650" y="352" class="math-box">2. Accumulator Bit-width:</text>
  <text x="665" y="370" class="math-box">B_acc ≥ B_ADC + ⌈log₂(K_c)⌉</text>
  <text x="665" y="388" class="label-sub">• For K_c = 4:  B_acc ≥ 6 bits</text>
  <text x="665" y="404" class="label-sub">• For K_c = 16: B_acc ≥ 8 bits</text>
  <text x="665" y="420" class="label-sub">• For K_c = 64: B_acc ≥ 10 bits</text>
  <text x="650" y="450" class="label-bold" fill="#047857">Tiled Architecture Scalable to N=768+</text>

</svg>
