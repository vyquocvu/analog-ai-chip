<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .box-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 6; }
      .box-green { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 6; }
      .box-purple { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.5; rx: 6; }
      .box-orange { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; rx: 6; }
      .box-red { fill: #fff1f2; stroke: #f43f5e; stroke-width: 1.5; rx: 6; }
      .label-bold { font-size: 13px; font-weight: bold; fill: #0f172a; }
      .label-sub { font-size: 11px; fill: #64748b; }
      .label-blue { font-size: 12px; font-weight: bold; fill: #2563eb; }
      .label-green { font-size: 12px; font-weight: bold; fill: #047857; }
      .label-purple { font-size: 12px; font-weight: bold; fill: #9333ea; }
      .label-orange { font-size: 12px; font-weight: bold; fill: #ea580c; }
      .math-box { font-family: 'Menlo', 'Consolas', monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="#ffffff"/>

  <!-- Title Header -->
  <text x="480" y="32" text-anchor="middle" class="title">Accelerator Scheduling &amp; Temporal Reuse (0023)</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Spatial weight-stationary mapping vs time-multiplexed physical tile reuse</text>

  <!-- Left: Workload Decomposition -->
  <rect x="35" y="75" width="280" height="425" class="box"/>
  <text x="50" y="102" class="label-bold">1. Transformer Layer Workload</text>
  <text x="50" y="118" class="label-sub">d_model = 128, d_ffn = 512 (768 Blocks)</text>

  <!-- Layer blocks list -->
  <rect x="50" y="135" width="250" height="70" class="box-blue"/>
  <text x="65" y="157" class="label-blue">Attention QKV Projection:</text>
  <text x="65" y="175" class="math-box">W_qkv: 384 × 128 (49k MACs)</text>
  <text x="65" y="193" class="math-box">192 tiles (16×16) | 25.0%</text>

  <rect x="50" y="215" width="250" height="60" class="box-green"/>
  <text x="65" y="235" class="label-green">Attention Out Projection:</text>
  <text x="65" y="253" class="math-box">W_out: 128 × 128 (16k MACs)</text>
  <text x="65" y="268" class="math-box">64 tiles (16×16) | 8.3%</text>

  <rect x="50" y="285" width="250" height="65" class="box-orange"/>
  <text x="65" y="305" class="label-orange">MLP Up / Gate Projection:</text>
  <text x="65" y="323" class="math-box">W_up: 512 × 128 (65k MACs)</text>
  <text x="65" y="340" class="math-box">256 tiles (16×16) | 33.3%</text>

  <rect x="50" y="360" width="250" height="65" class="box-purple"/>
  <text x="65" y="380" class="label-purple">MLP Down Projection:</text>
  <text x="65" y="398" class="math-box">W_down: 128 × 512 (65k MACs)</text>
  <text x="65" y="415" class="math-box">256 tiles (16×16) | 33.3%</text>

  <text x="175" y="455" text-anchor="middle" class="label-bold">Total Workload Size:</text>
  <text x="175" y="475" text-anchor="middle" class="math-box">768 physical 16×16 blocks</text>

  <!-- Middle: Scheduling Strategies -->
  <rect x="330" y="75" width="290" height="425" class="box"/>
  <text x="345" y="102" class="label-bold">2. Scheduling Paradigms</text>
  <text x="345" y="118" class="label-sub">Tradeoff between Area &amp; Write Overhead</text>

  <!-- Strategy A: Weight-Stationary -->
  <rect x="345" y="135" width="260" height="155" class="box-green"/>
  <text x="355" y="157" class="label-green">A. Weight-Stationary (N_tiles ≥ 768)</text>
  <text x="355" y="177" class="math-box">• All 768 blocks resident</text>
  <text x="355" y="195" class="math-box">• Programmed ONCE at startup</text>
  <text x="355" y="213" class="math-box">• Zero rewrite overhead</text>
  <text x="355" y="235" class="math-box">• MVM cycle: 20 ns / token (assumed)</text>
  <text x="355" y="255" class="math-box">• Optimal for token generation</text>
  <text x="355" y="275" class="label-bold" fill="#047857">99.9× faster on 100 tokens ✓</text>

  <!-- Strategy B: Temporal Multiplexing -->
  <rect x="345" y="305" width="260" height="180" class="box-red"/>
  <text x="355" y="327" class="label-red">B. Temporal Multiplexing (N_tiles &lt; 768)</text>
  <text x="355" y="347" class="math-box">• Small tile pool (e.g. 16..64 tiles)</text>
  <text x="355" y="365" class="math-box">• Reprogrammed per layer</text>
  <text x="355" y="385" class="math-box">• Write penalty: t_prog = 10 μs (assumed)</text>
  <text x="355" y="403" class="math-box">• Incurs 704 rewrites / token</text>
  <text x="355" y="425" class="math-box">• Bounded silicon area</text>
  <text x="355" y="445" class="label-sub">Bottlenecked by NVM write speed</text>

  <!-- Right: Execution Gantt Timeline -->
  <rect x="635" y="75" width="290" height="425" class="box"/>
  <text x="650" y="102" class="label-bold">3. Execution Timeline (Gantt)</text>
  <text x="650" y="118" class="label-sub">Write (10μs) vs Read (20ns) Asymmetry</text>

  <!-- Weight Stationary Timeline -->
  <rect x="650" y="140" width="260" height="120" class="box-blue"/>
  <text x="660" y="162" class="label-blue">Weight-Stationary Timeline:</text>
  <!-- Bar graphic -->
  <rect x="660" y="175" width="70" height="20" fill="#f97316" rx="2"/>
  <text x="695" y="189" text-anchor="middle" font-size="9" fill="#ffffff">Init (10μs)</text>
  <rect x="735" y="175" width="165" height="20" fill="#10b981" rx="2"/>
  <text x="815" y="189" text-anchor="middle" font-size="9" fill="#ffffff">Streaming MVM (20ns)</text>
  <text x="660" y="215" class="math-box">Token 1:  Init + MVM</text>
  <text x="660" y="232" class="math-box">Token 2+: MVM ONLY (20ns)</text>
  <text x="660" y="250" class="math-box">Total @ 100 tok: ~7.7 ms</text>

  <!-- Temporal Multiplexing Timeline -->
  <rect x="650" y="275" width="260" height="145" class="box-purple"/>
  <text x="660" y="297" class="label-purple">Temporal Reuse Timeline:</text>
  <!-- Repetitive pattern -->
  <g transform="translate(660, 310)">
    <rect x="0" y="0" width="35" height="20" fill="#f43f5e" rx="2"/>
    <text x="17" y="14" text-anchor="middle" font-size="8" fill="#ffffff">Prog</text>
    <rect x="38" y="0" width="15" height="20" fill="#3b82f6" rx="2"/>
    <rect x="56" y="0" width="35" height="20" fill="#f43f5e" rx="2"/>
    <rect x="94" y="0" width="15" height="20" fill="#3b82f6" rx="2"/>
    <rect x="112" y="0" width="35" height="20" fill="#f43f5e" rx="2"/>
    <rect x="150" y="0" width="15" height="20" fill="#3b82f6" rx="2"/>
    <rect x="168" y="0" width="35" height="20" fill="#f43f5e" rx="2"/>
  </g>
  <text x="660" y="355" class="math-box">Repeated on EVERY token:</text>
  <text x="660" y="375" class="math-box">4 Layer Swaps × 10 μs (assumed)</text>
  <text x="660" y="395" class="math-box">Total @ 100 tok: ~768 ms</text>

  <rect x="650" y="430" width="260" height="55" class="box-green"/>
  <text x="660" y="450" class="label-green">Architectural Decision:</text>
  <text x="660" y="470" class="math-box">Prioritize on-chip tile capacity</text>

</svg>
