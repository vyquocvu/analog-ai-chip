name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: |
          python book/0001-crossbar-mvm/train.py
          python book/0002-differential-pairs/train.py
          python book/0003-converters-and-noise/train.py
          python book/0004-tiling/train.py
          python scripts/run_llm_sim.py

  # Optional job: exercises the 0005/0006 SPICE circuit sims when the ngspice
  # engine is available. If ngspice or its shared library is missing, the tests
  # skip cleanly (exit 0), so this never hard-fails on a dependency-light runner.
  circuit-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ngspice || true
      - run: python -m pip install -e '.[dev,sim]'
      - run: pytest tests/test_circuit_sim.py -q
