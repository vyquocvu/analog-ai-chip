name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: |
          python lessons/0001-crossbar-mvm/train.py
          python lessons/0002-differential-pairs/train.py
          python lessons/0003-converters-and-noise/train.py
          python lessons/0004-tiling/train.py
